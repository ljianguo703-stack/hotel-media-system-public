<div class="page-head"><div><h1>管理中心</h1></div><button class="btn" @click="reload()" :disabled="busy">刷新</button></div>
<div class="management-tabs" role="tablist" aria-label="管理模块"><template x-for="t in opsTabs" :key="t.id"><button role="tab" :aria-selected="opsTab===t.id" :class="{active:opsTab===t.id}" @click="setOpsTab(t.id)" x-text="t.name"></button></template></div>
<p class="managed-loading" role="status" aria-live="polite" x-show="opsLoading">正在读取管理数据…</p>
<template x-if="opsTab==='ad_playback'"><div x-html="playbackMarkup"></div></template>
<template x-if="['advertisers','assets','groups'].includes(opsTab)"><div>
<div class="managed-head"><div><h2 x-text="opsTitle"></h2><p class="muted" x-text="'共 '+opsRows.length+' 项 · 已选 '+opsSelected.length+' 项'"></p></div><div class="head-actions" x-show="writable&&(opsTab!=='groups'||administrator)"><button class="btn" @click="editEntity(opsKind)">新增资料</button><template x-if="opsTab==='assets'"><div class="head-actions"><label class="btn upload-label">上传素材<input type="file" accept="image/jpeg,image/png,image/webp,video/mp4,video/webm,video/quicktime" @change="uploadManagedAsset($event.target.files[0]);$event.target.value=''" :disabled="uploading"></label><button class="btn primary" @click="discoverAssets()" :disabled="busy">发现本地素材</button></div></template></div></div>
<div class="managed-filters"><input class="form-input" aria-label="搜索管理资料" placeholder="搜索名称、联系人或备注" x-model="opsQuery" @input="opsPage=0"><select class="form-input" x-model="opsStatus" @change="opsPage=0" aria-label="资料状态"><option value="">全部状态</option><option value="enabled">已启用</option><option value="disabled">已停用</option></select></div>
<label class="check" x-show="writable"><input type="checkbox" :checked="opsRows.length>0&&opsRows.every(r=>opsSelected.includes(r.id))" @change="selectSet('opsSelected',opsRows.map(r=>r.id))">全选当前筛选结果</label>
<div class="managed-table"><table><thead><tr><th class="select-col">选择</th><th>名称</th><th>资料 / 文件</th><th>引用</th><th>状态</th><th>操作</th></tr></thead><tbody><template x-for="r in opsRows.slice(opsPage*opsLimit,(opsPage+1)*opsLimit)" :key="r.id"><tr :class="{chosen:opsSelected.includes(r.id)}"><td data-label="选择" class="select-col"><input type="checkbox" :checked="opsSelected.includes(r.id)" @change="toggleSet('opsSelected',r.id)" :aria-label="'选择资料 '+r.name" x-show="writable"></td><td data-label="名称"><strong x-text="r.name"></strong><small class="sub" x-show="r.notes" x-text="r.notes"></small></td><td data-label="资料"><span class="tag warn" x-show="opsTab==='advertisers'&&r.house">酒店自有</span> <span x-text="opsTab==='advertisers'?[r.contact,r.phone].filter(Boolean).join(' / '):opsTab==='assets'?(r.format+' · '+bytes(r.bytes)):'按客房或用途分组'"></span><small class="sub mono" x-show="r.path" :title="fileLabel(r.path)" x-text="fileLabel(r.path)"></small></td><td data-label="引用" x-text="r.references+' 项'"></td><td data-label="状态"><span class="tag" :class="r.enabled?'online':'neutral'" x-text="r.enabled?'启用':'停用'"></span></td><td data-label="操作"><div class="row"><button class="text-btn" @click="editEntity(opsKind,r)" x-show="writable">编辑</button><button class="text-btn" @click="assetPreview(r)" x-show="opsTab==='assets'">预览</button><button class="text-btn" @click="lifecycle(opsKind,r.enabled?'disable':'enable',[r.id])" x-show="writable" x-text="r.enabled?'停用':'启用'"></button><button class="text-btn danger-text" @click="lifecycle(opsKind,'archive',[r.id])" x-show="writable">删除</button></div></td></tr></template></tbody></table><div class="empty-state" x-show="!opsRows.length">暂无符合条件的资料。</div></div>
<div class="managed-pager" x-show="opsRows.length>opsLimit"><button class="btn" @click="opsPage--" :disabled="opsPage===0">上一页</button><span x-text="(opsPage+1)+' / '+Math.ceil(opsRows.length/opsLimit)"></span><button class="btn" @click="opsPage++" :disabled="(opsPage+1)*opsLimit>=opsRows.length">下一页</button></div>
<div class="managed-bulk" x-show="opsSelected.length&&writable"><strong x-text="'已选 '+opsSelected.length+' 项'"></strong><button class="btn" @click="lifecycle(opsKind,'enable')" :disabled="busy||opsSelected.length>500">批量启用</button><button class="btn" @click="lifecycle(opsKind,'disable')" :disabled="busy||opsSelected.length>500">批量停用</button><button class="btn" @click="lifecycle(opsKind,'archive')" :disabled="busy||opsSelected.length>500">批量删除</button><button class="text-btn" @click="opsSelected=[]">取消选择</button></div>
</div></template>
<template x-if="opsTab==='orders'"><div>
<div class="managed-head"><div><h2>投放单</h2><p class="muted" x-text="'共 '+(opsData.total||0)+' 张 · 即将到期 '+(opsData.summary?.expiring||0)+' 张 · 报价合计 '+moneyLabel(opsData.summary?.quoted_total_text||'0.00')+' · 已登记收款合计 '+moneyLabel(opsData.summary?.received_total_text||'0.00')"></p></div><div class="head-actions"><button class="btn" @click="editCurrency()" x-show="administrator" x-text="billingCurrency?'币种 '+billingCurrency:'设置币种'"></button><button class="btn" @click="chooseReport()">商户报告</button><button class="btn primary" @click="editOrder()" x-show="writable">新建投放单</button></div></div>
<p class="inline-notice neutral" x-show="!billingCurrency">尚未设置广告币种：可以先登记投放单和目标；报价与收款需管理员设置币种后填写。</p>
<div class="managed-filters"><input class="form-input" aria-label="搜索投放单" placeholder="搜索单号、广告主、套餐或备注" x-model="opsQuery" @input.debounce.400ms="setOrderFilter()"><select class="form-input" aria-label="执行状态" x-model="orderFilters.state" @change="setOrderFilter()"><option value="">全部执行状态</option><template x-for="s in orderStates" :key="s"><option :value="s" x-text="s"></option></template></select><select class="form-input" aria-label="广告主" x-model="orderFilters.advertiser" @change="setOrderFilter()"><option value="">全部广告主</option><template x-for="a in (data.advertisers||[]).filter(a=>!a._archived)" :key="a.id"><option :value="a.id" x-text="a.name"></option></template></select><select class="form-input" aria-label="收款状态" x-model="orderFilters.payment" @change="setOrderFilter()"><option value="">全部收款状态</option><template x-for="s in paymentStates" :key="s"><option :value="s" x-text="s"></option></template></select><label class="check"><input type="checkbox" x-model="orderFilters.expiring" @change="setOrderFilter()">只看即将到期</label><label class="check"><input type="checkbox" x-model="orderFilters.archived" @change="setOrderFilter()">回收站中的投放单</label></div>
<div class="managed-table"><table><thead><tr><th>单号 / 广告主</th><th>套餐 / 范围</th><th>周期</th><th>目标进度</th><th>报价 / 收款</th><th>状态</th><th>操作</th></tr></thead><tbody><template x-for="r in opsData.rows||[]" :key="r.id"><tr>
<td data-label="单号"><strong x-text="r.code"></strong><small class="sub" x-text="r.advertiser_name"></small></td>
<td data-label="套餐"><span x-text="r.package_name"></span><small class="sub" x-text="tierName(r.tier)+' · '+r.group"></small></td>
<td data-label="周期"><span x-text="r.start+' 至 '+r.end"></span><small class="sub" :class="{'danger-text':r.expiring}" x-text="r.state==='执行中'?dayText(r.days_left):r.state"></small></td>
<td data-label="目标进度"><div class="order-progress" role="progressbar" aria-label="目标进度" :aria-valuenow="r.progress.percent??0" aria-valuemin="0" aria-valuemax="100"><span :style="'width:'+(r.progress.percent??0)+'%'"></span></div><small class="sub" x-text="progressText(r.progress)"></small></td>
<td data-label="报价 / 收款"><span x-text="r.quoted_price?moneyLabel(r.quoted_text):'未登记报价'"></span><small class="sub" x-text="r.payment_status+(r.received_amount?' · '+moneyLabel(r.received_text):'')"></small></td>
<td data-label="状态"><span class="tag" :class="r.state==='执行中'?'online':r.state==='已到期'?'offline':'neutral'" x-text="r.state"></span> <span class="tag warn" x-show="r.expiring">即将到期</span><small class="sub danger-text" x-show="r.warnings.length" x-text="r.warnings.length+' 项提醒'"></small></td>
<td data-label="操作"><div class="row"><button class="text-btn" @click="openOrder(r)">详情</button><button class="text-btn" @click="openMerchantReport({order:r.id})">报告</button><template x-if="!r._archived&&writable"><span class="row"><button class="text-btn" @click="editOrder(r)">编辑</button><button class="text-btn" @click="lifecycle('order',r.enabled?'disable':'enable',[r.id])" x-text="r.enabled?'停用':'启用'"></button><button class="text-btn danger" @click="lifecycle('order','archive',[r.id])">移入回收站</button></span></template><template x-if="r._archived&&writable"><button class="text-btn" @click="lifecycle('order','restore',[r.id])">恢复</button></template></div></td>
</tr></template></tbody></table><div class="empty-state" x-show="!(opsData.rows||[]).length&&!opsLoading">暂无投放单。先准备“广告主”和“广告套餐”，再新建投放单。</div></div>
<div class="managed-pager" x-show="(opsData.total||0)>opsLimit"><button class="btn" :disabled="opsPage===0" @click="opsPage--;loadOperations()">上一页</button><span x-text="(opsPage+1)+' / '+Math.ceil((opsData.total||0)/opsLimit)"></span><button class="btn" :disabled="(opsPage+1)*opsLimit>=(opsData.total||0)" @click="opsPage++;loadOperations()">下一页</button></div>
<p class="form-hint">进度只统计关联广告任务在投放周期内电视实际上报的事件（一档按全屏开始次数，二、三档按文字可见分钟）。报价与收款均为人工登记，系统不按播放次数推算金额。</p>
</div></template>
<template x-if="opsTab==='packages'"><div>
<div class="managed-head"><div><h2>广告套餐</h2><p class="muted" x-text="'共 '+packageRows.length+' 个套餐 · '+(billingCurrency?'币种 '+billingCurrency:'未设置币种')"></p></div><div class="head-actions"><button class="btn" @click="editCurrency()" x-show="administrator" x-text="billingCurrency?'币种 '+billingCurrency:'设置币种'"></button><button class="btn primary" @click="editPackage()" x-show="writable">新增套餐</button></div></div>
<div class="managed-filters"><input class="form-input" aria-label="搜索套餐" placeholder="搜索套餐名称或备注" x-model="opsQuery"><select class="form-input" x-model="opsStatus" aria-label="套餐状态"><option value="">全部状态</option><option value="enabled">已启用</option><option value="disabled">已停用</option></select></div>
<div class="managed-table"><table><thead><tr><th>套餐</th><th>档位 / 位置</th><th>周期 / 目标</th><th>标价</th><th>引用</th><th>状态</th><th>操作</th></tr></thead><tbody><template x-for="p in packageRows" :key="p.id"><tr>
<td data-label="套餐"><strong x-text="p.name"></strong><small class="sub" x-show="p.notes" x-text="p.notes"></small></td>
<td data-label="档位"><span x-text="(p.tiers||[p.tier]).map(t=>tierName(t)).join(' + ')"></span><small class="sub" x-text="p.placements.map(x=>placementName(p.tier,x)).join('、')"></small></td>
<td data-label="周期 / 目标"><span x-text="p.default_days+' 天'"></span><small class="sub" x-text="p.target?('目标 '+p.target+(p.tier===1?' 次全屏开始':' 分钟文字可见')):'未设目标'"></small></td>
<td data-label="标价" x-text="p.list_price?moneyLabel(minorText(p.list_price)):'—'"></td>
<td data-label="引用" x-text="p.references+' 张投放单'"></td>
<td data-label="状态"><span class="tag" :class="p.enabled?'online':'neutral'" x-text="p.enabled?'启用':'停用'"></span></td>
<td data-label="操作"><div class="row" x-show="writable"><button class="text-btn" @click="editPackage(p)">编辑</button><button class="text-btn" @click="duplicatePackage(p)">复制模板</button><button class="text-btn" @click="lifecycle('package',p.enabled?'disable':'enable',[p.id])" x-text="p.enabled?'停用':'启用'"></button><button class="text-btn danger" @click="lifecycle('package','archive',[p.id])">移入回收站</button></div></td>
</tr></template></tbody></table><div class="empty-state" x-show="!packageRows.length">暂无套餐。</div></div>
</div></template>
<template x-if="opsTab==='control'"><div>
<div class="managed-head"><div><h2>广告总控</h2><p class="muted" x-text="opsData.control?('当前版本 '+opsData.control.version+' · 已执行 '+(opsData.counts?.['已执行']||0)+' 台 · 已拉取未回执 '+(opsData.counts?.['已拉取未回执']||0)+' 台 · 待确认 '+(opsData.counts?.['待确认']||0)+' 台'):'正在读取…'"></p></div><div class="head-actions" x-show="writable&&opsData.control"><button class="btn danger-fill" x-show="!opsData.control?.stopped" @click="askStop(true)">一键停止商业广告</button><button class="btn primary" x-show="opsData.control?.stopped" @click="askStop(false)">恢复商业广告</button></div></div>
<div class="inline-notice" :class="opsData.control?.stopped?'failure':'neutral'" x-show="opsData.control"><strong x-text="opsData.control?.stopped?'商业广告已停播':'商业广告正常投放'"></strong><span x-text="opsData.control?.stopped?('由 '+opsData.control.stopped_by+' 于 '+date(opsData.control.stopped_at)+' 停止；继续播放的酒店自有广告主：'+((opsData.house_merchants||[]).join('、')||'无')):'可在“广告主”中把酒店自有广告主标记为“酒店自有”，停播时它们继续播放。'"></span></div>
<template x-if="controlDraft"><form class="panel managed-policy" @submit.prevent="saveControlLimits()" @input="controlDirty=true"><label>每小时全屏广告最多<input class="form-input" type="number" min="0" max="1000" x-model="controlDraft.max_fullscreen_per_hour" :disabled="!administrator">次</label><label>每小时全屏广告总时长<input class="form-input" type="number" min="0" max="3600" x-model="controlDraft.max_fullscreen_seconds_per_hour" :disabled="!administrator">秒</label><label>两条全屏广告最短间隔<input class="form-input" type="number" min="0" max="86400" x-model="controlDraft.min_fullscreen_gap_seconds" :disabled="!administrator">秒</label><label>滚动文字时段<input class="form-input" type="time" x-model="controlDraft.text_start" :disabled="!administrator">至<input class="form-input" type="time" x-model="controlDraft.text_end" :disabled="!administrator"></label><small class="muted">0 表示不限；文字时段都留空表示全天，可跨午夜（例如 08:00 至 01:00）。这些上限跨所有广告任务共同生效，与每条广告自己的频控同时满足。</small><button class="btn primary" type="submit" x-show="administrator" :disabled="busy">保存统一上限</button></form></template>
<div class="managed-filters"><select class="form-input" x-model="controlFilter" aria-label="执行状态"><option value="">全部电视</option><option value="待确认">待确认</option><option value="已拉取未回执">已拉取未回执</option><option value="已执行">已执行</option></select></div>
<div class="managed-table"><table><thead><tr><th>房号</th><th>设备组</th><th>在线</th><th>执行状态</th><th>已拉取版本</th><th>已回执版本</th></tr></thead><tbody><template x-for="d in controlRows" :key="d.id"><tr><td data-label="房号"><strong x-text="d.room"></strong><small class="sub mono" x-text="d.id"></small></td><td data-label="设备组" x-text="d.group"></td><td data-label="在线"><span class="tag" :class="d.online?'online':'offline'" x-text="d.online?'在线':'离线'"></span></td><td data-label="执行状态"><span class="tag" :class="d.state==='已执行'?'online':d.state==='待确认'?'offline':'warn'" x-text="d.state"></span></td><td data-label="已拉取版本" x-text="d.delivered_version?('v'+d.delivered_version+' · '+date(d.delivered_at)):'—'"></td><td data-label="已回执版本" x-text="d.applied_version?('v'+d.applied_version+' · '+date(d.applied_at)):'—'"></td></tr></template></tbody></table><div class="empty-state" x-show="!controlRows.length">暂无电视。</div></div>
<p class="form-hint" x-text="opsData.basis||''"></p>
</div></template>
<template x-if="opsTab==='home'"><div>
<div class="managed-head"><div><h2>电视首页</h2><p class="muted">首页背景、酒店联系二维码与扫码连 Wi-Fi，以及只读的酒店指南卡片。保存后电视在下一次刷新（约 30 秒内）更新。</p></div></div>
<form class="panel home-menu-form" @submit.prevent="saveMenu()" @input="menuDirty=true">
<div class="managed-head"><div><h3>首页菜单卡片</h3><p class="muted">从左到右排列，首页显示 1–5 张。可打开栏目、分类、专题或电视已安装的应用。5 张时名称建议 6 字以内。</p><p class="form-hint" x-show="!menuDirty&&homeData.effective_menu" x-text="'电视清单当前显示 '+(homeData.effective_menu?.length||0)+' 张；所有目标撤下时使用默认菜单。'"></p></div><div class="head-actions" x-show="writable"><button class="btn" type="button" @click="menuAdd()" :disabled="menuDraft.length>=20">新增菜单卡片</button><button class="text-btn" type="button" @click="resetMenu()">恢复默认</button></div></div>
<div class="home-menu-preview" aria-label="首页菜单顺序预览"><template x-for="card in menuShown" :key="card.id"><span x-text="card.name||'未命名'"></span></template></div>
<div class="home-menu-list"><template x-for="(card,index) in menuDraft" :key="card.id"><article class="home-menu-card" :class="{'is-hidden':!card.enabled}">
<div class="home-menu-top"><strong x-text="(index+1)+' · '+(card.name||'未命名')"></strong><div class="row" x-show="writable"><button class="text-btn" type="button" @click="menuMove(index,-1)" :disabled="index===0" :aria-label="'左移 '+card.name">左移</button><button class="text-btn" type="button" @click="menuMove(index,1)" :disabled="index===menuDraft.length-1" :aria-label="'右移 '+card.name">右移</button><button class="text-btn" type="button" @click="menuToggle(card)" x-text="card.enabled?'隐藏':'显示'"></button><button class="text-btn danger" type="button" @click="menuRemove(card)">移入回收站</button></div></div>
<p class="form-hint" x-show="card.target_available===false">原目标暂未展示或已撤下；请选择新目标，或隐藏此卡片后保存。</p><div class="home-menu-fields"><label>卡片名称<input class="form-input" maxlength="12" x-model="card.name" required :disabled="!writable" :aria-label="'卡片 '+(index+1)+' 名称'"></label><label>打开方式<select class="form-input" x-model="card.type" @change="menuType(card)" :disabled="!writable" :aria-label="'卡片 '+(index+1)+' 打开方式'"><option value="builtin">内置栏目</option><option value="category">媒体分类</option><option value="topic">自定义专题</option><option value="app">已安装应用</option></select></label><label>图标<select class="form-input" x-model="card.icon" :disabled="!writable" :aria-label="'卡片 '+(index+1)+' 图标'"><template x-for="[id,label] in Object.entries(menuIcons)" :key="id"><option :value="id" x-text="label"></option></template></select></label>
<label class="home-menu-target">打开目标
<template x-if="card.type==='builtin'"><select class="form-input" x-model="card.target" :disabled="!writable" :aria-label="'卡片 '+(index+1)+' 栏目'"><template x-for="entry in menuBuiltins" :key="entry.id"><option :value="entry.id" x-text="entry.name"></option></template></select></template>
<template x-if="card.type==='category'"><select class="form-input" x-model="card.target" :disabled="!writable" :required="card.enabled" :aria-label="'卡片 '+(index+1)+' 分类'"><option value="">选择分类</option><template x-for="entry in menuCategories" :key="entry.id"><option :value="entry.id" x-text="entry.name+(entry.enabled===false?'（停用中）':'')"></option></template></select></template>
<template x-if="card.type==='topic'"><select class="form-input" x-model="card.target" :disabled="!writable" :required="card.enabled" :aria-label="'卡片 '+(index+1)+' 专题'"><option value="">选择专题</option><template x-for="entry in topicRows" :key="entry.id"><option :value="entry.id" x-text="entry.name+(entry.live?'':'（未展示）')"></option></template></select></template>
<template x-if="card.type==='app'"><div><select class="form-input" @change="menuAppSelect(card,$event.target.value)" :disabled="!writable" :aria-label="'卡片 '+(index+1)+' 选择已安装应用'"><option value="">从电视已回报应用中选择</option><template x-for="app in menuApps" :key="app.package"><option :value="app.package" x-text="app.label+' · '+app.rooms.join('、')"></option></template></select><input class="form-input" x-model="card.target" maxlength="200" placeholder="也可手填包名，如 com.example.player" required :disabled="!writable" :aria-label="'卡片 '+(index+1)+' 应用包名'"><small class="muted">每台电视必须已安装该应用。新客户端联网后回报应用；应用内的广告由该应用控制。</small></div></template>
</label></div></article></template></div>
<div class="row" x-show="writable"><button class="btn primary" type="submit" :disabled="busy||!menuDirty">保存菜单</button><button class="btn" type="button" @click="menuLoaded(homeData)" :disabled="!menuDirty">取消修改</button><small class="muted" x-text="'当前显示 '+menuShown.length+'/5 张'+(menuDirty?' · 有未保存修改':'')"></small></div>
<details class="home-menu-trash" x-show="menuTrash.length"><summary x-text="'已回收菜单卡片（'+menuTrash.length+'）'"></summary><p class="muted" x-text="'按回收站规则清理，当前 '+(data.management_policy?.trash_days||30)+' 天。恢复后默认为隐藏，不挤占首页。'"></p><template x-for="card in menuTrash" :key="card.id"><div class="home-menu-top"><span x-text="card.name"></span><button type="button" class="text-btn" x-show="writable" @click="restoreMenuCard(card)" :disabled="busy">恢复</button></div></template></details>
</form>
<template x-if="homeDraft"><form class="panel home-form" @submit.prevent="saveHome()" @input="homeDirty=true">
<div class="home-grid">
<section><h3>首页背景</h3><div class="home-preview bg" :style="homeDraft.background?'background-image:url(\''+homeDraft.background+'\')':''"><span x-show="!homeDraft.background">未设置，使用默认深色背景</span></div><div class="row"><label class="btn upload-label" x-show="writable"><span x-text="homeUploading==='background'?'上传中…':'上传背景图'"></span><input type="file" accept="image/jpeg,image/png,image/webp" @change="uploadHome($event.target.files[0],'background');$event.target.value=''"></label><button type="button" class="text-btn danger" x-show="writable&&homeDraft.background" @click="homeDraft.background='';homeDirty=true">移除</button></div><p class="form-hint">首次安装随机选一张，全店共用；选择后点击“保存首页设置”。也可继续上传自己的图片。</p><div class="home-background-options" role="group" aria-label="默认背景图片"><template x-for="image in (homeData.default_backgrounds||[])" :key="image.id"><button type="button" class="home-background-option" :class="{'selected':homeDraft.background===image.path}" :aria-pressed="homeDraft.background===image.path" :aria-label="'选择背景 '+image.name" @click="selectDefaultBackground(image)" :disabled="!writable"><img :src="image.path" :alt="image.name" loading="lazy"><span x-text="image.name"></span></button></template></div><p class="form-hint">建议使用清晰横图；原图完整显示、允许留边。时间和店名为透明底白字细黑描边，二维码有独立对比底板；海报里的文字保留原色。</p></section>
<section><h3>联系二维码</h3><div class="home-preview qr"><template x-if="homeDraft.contact_qr"><img :src="homeDraft.contact_qr" alt="联系二维码预览"></template><span x-show="!homeDraft.contact_qr">未上传</span></div><div class="row"><label class="btn upload-label" x-show="writable"><span x-text="homeUploading==='contact_qr'?'上传中…':'上传二维码图片'"></span><input type="file" accept="image/jpeg,image/png,image/webp" @change="uploadHome($event.target.files[0],'contact_qr');$event.target.value=''"></label><button type="button" class="text-btn danger" x-show="writable&&homeDraft.contact_qr" @click="homeDraft.contact_qr='';homeDirty=true">移除</button></div><label class="form-label" for="home-contact-label">说明文字</label><input id="home-contact-label" class="form-input" maxlength="40" x-model="homeDraft.contact_label" :disabled="!writable"></section>
<section><h3>Wi-Fi 二维码</h3><div class="home-preview qr"><template x-if="homeDraft.wifi_qr"><img :src="homeDraft.wifi_qr" alt="Wi-Fi 二维码预览"></template><span x-show="!homeDraft.wifi_qr">填写后保存自动生成</span></div>
<label class="form-label" for="home-ssid">Wi-Fi 名称</label><input id="home-ssid" class="form-input" maxlength="32" x-model="homeDraft.wifi_ssid" :disabled="!writable" autocomplete="off">
<div class="form-grid"><div><label class="form-label" for="home-sec">加密方式</label><select id="home-sec" class="form-input" x-model="homeDraft.wifi_security" :disabled="!writable"><option value="WPA">WPA/WPA2/WPA3</option><option value="WEP">WEP</option><option value="nopass">无密码</option></select></div><div><label class="form-label" for="home-pass">密码</label><input id="home-pass" class="form-input" maxlength="63" x-model="homeDraft.wifi_password" :disabled="!writable||homeDraft.wifi_security==='nopass'" autocomplete="off"></div></div>
<label class="check"><input type="checkbox" x-model="homeDraft.wifi_hidden" :disabled="!writable">隐藏网络（不广播名称）</label><label class="check"><input type="checkbox" x-model="homeDraft.wifi_show_password" :disabled="!writable">电视上同时显示密码文字</label>
<label class="form-label" for="home-wifi-label">说明文字</label><input id="home-wifi-label" class="form-input" maxlength="40" x-model="homeDraft.wifi_label" :disabled="!writable"></section>
</div>
<label class="check"><input type="checkbox" x-model="homeDraft.show_qr" :disabled="!writable">在电视首页显示以上二维码</label>
<div class="row"><button class="btn primary" type="submit" x-show="writable" :disabled="busy||!!homeUploading">保存首页设置</button><small class="muted" x-show="homeDirty">有未保存的修改</small></div>
</form></template>
<div class="managed-head"><div><h2>酒店指南卡片</h2><p class="muted">只读信息：早餐、Wi-Fi、前台电话、退房时间、交通与店内服务等。不产生订单、预订或付款。</p></div><div class="head-actions"><button class="btn primary" x-show="writable" @click="editGuide()">新增卡片</button></div></div>
<div class="managed-table"><table><thead><tr><th>排序</th><th>标题</th><th>内容</th><th>状态</th><th>操作</th></tr></thead><tbody><template x-for="g in guideRows" :key="g.id"><tr><td data-label="排序" x-text="g.sort"></td><td data-label="标题"><strong x-text="g.name"></strong></td><td data-label="内容"><span class="clamp" x-text="g.body"></span></td><td data-label="状态"><span class="tag" :class="g.enabled?'online':'neutral'" x-text="g.enabled?'显示':'停用'"></span></td><td data-label="操作"><div class="row" x-show="writable"><button class="text-btn" @click="editGuide(g)">编辑</button><button class="text-btn" @click="lifecycle('guide',g.enabled?'disable':'enable',[g.id])" x-text="g.enabled?'停用':'启用'"></button><button class="text-btn danger" @click="lifecycle('guide','archive',[g.id])">移入回收站</button></div></td></tr></template></tbody></table><div class="empty-state" x-show="!guideRows.length">暂无指南卡片。</div></div>
</div></template>
<template x-if="opsTab==='topics'"><div>
<div class="managed-head"><div><h2>专题</h2><p class="muted" x-text="'在电视首页作为栏目显示；可定时上下线（'+(homeData.timezone||'')+'）。撤下专题不会删除影片。'"></p></div><div class="head-actions"><button class="btn primary" x-show="writable" @click="editTopic()">新建专题</button></div></div>
<div class="managed-table"><table><thead><tr><th>排序</th><th>专题</th><th>内容</th><th>上线 / 下线</th><th>状态</th><th>操作</th></tr></thead><tbody><template x-for="t in topicRows" :key="t.id"><tr><td data-label="排序" x-text="t.sort"></td><td data-label="专题"><strong x-text="t.name"></strong><small class="sub" x-show="t.description" x-text="t.description"></small></td><td data-label="内容" x-text="t.item_ids.length+' 部（可播 '+t.item_ids.filter(id=>mediaPlayable(id)).length+'）'"></td><td data-label="上线 / 下线" x-text="(t.start||'立即')+' → '+(t.end||'长期')"></td><td data-label="状态"><span class="tag" :class="t.live?'online':'neutral'" x-text="topicState(t)"></span></td><td data-label="操作"><div class="row" x-show="writable"><button class="text-btn" @click="editTopic(t)">编辑</button><button class="text-btn" @click="lifecycle('topic',t.enabled?'disable':'enable',[t.id])" x-text="t.enabled?'停用':'启用'"></button><button class="text-btn danger" @click="lifecycle('topic','archive',[t.id])">移入回收站</button></div></td></tr></template></tbody></table><div class="empty-state" x-show="!topicRows.length">暂无专题。</div></div>
</div></template>
<template x-if="opsTab==='compat'"><div>
<div class="managed-head"><div><h2>兼容检查</h2><p class="form-hint">暂停会停止本次转换并释放队列；继续时从头排到队尾，原文件不变。</p><p class="muted" x-text="'共 '+(opsData.total||0)+' 个文件 · '+Object.entries(opsData.counts||{}).map(([k,v])=>verdictLabels[k]+' '+v).join(' · ')"></p></div><div class="head-actions" x-show="writable"><button class="btn" @click="probeAll()" :disabled="busy||!opsData.tools?.ffprobe">预检未检文件</button><button class="btn primary" @click="enqueueRows(compatSelected)" :disabled="busy||!compatSelected.length||!opsData.tools?.ffmpeg" x-text="'生成兼容版（'+compatSelected.length+'）'"></button></div></div>
<div class="inline-notice failure" x-show="opsData.tools&&(!opsData.tools.ffprobe||!opsData.tools.ffmpeg)"><strong>服务器未安装 ffmpeg</strong><span>预检和兼容版需要服务器上的 ffmpeg / ffprobe；安装属于改动服务器环境，请先确认。</span></div>
<p class="form-hint">兼容版只生成副本，原文件不会被修改或移动；一次只转一个，低优先级运行。完成后电视自动改播兼容版，源文件一旦变化即停用该副本。</p>
<div class="managed-filters"><input class="form-input" aria-label="搜索文件" placeholder="搜索影片或分集" x-model="opsQuery" @input.debounce.400ms="opsPage=0;loadOperations()"><select class="form-input" x-model="compatVerdict" aria-label="预检结论"><option value="">全部结论</option><template x-for="[k,v] in Object.entries(verdictLabels)" :key="k"><option :value="k" x-text="v"></option></template></select><label class="check" x-show="writable"><input type="checkbox" :checked="compatRows.length>0&&compatRows.filter(r=>['remux','audio','video'].includes(r.verdict)).every(r=>compatSelected.includes(r.id))" @change="selectSet('compatSelected',compatRows.filter(r=>['remux','audio','video'].includes(r.verdict)&&!['queued','running','paused'].includes(r.job_status)).map(r=>r.id))">全选需处理的文件</label></div>
<div class="managed-table"><table><thead><tr><th class="select-col">选择</th><th>影片 / 文件</th><th>预检结论</th><th>媒体信息</th><th>兼容版</th><th>操作</th></tr></thead><tbody><template x-for="r in compatRows.slice(0,300)" :key="r.id"><tr :class="{chosen:compatSelected.includes(r.id)}">
<td data-label="选择" class="select-col"><input type="checkbox" x-show="writable&&['remux','audio','video'].includes(r.verdict)" :checked="compatSelected.includes(r.id)" @change="toggleSet('compatSelected',r.id)" :aria-label="'选择 '+r.title"></td>
<td data-label="影片"><strong x-text="r.title"></strong><small class="sub mono" x-text="fileLabel(r.route)"></small></td>
<td data-label="结论"><span class="tag" :class="verdictClass(r.verdict)" x-text="r.verdict_label"></span><template x-for="t in (r.reasons||[])" :key="t"><small class="sub" x-text="t"></small></template><template x-for="t in (r.warnings||[])" :key="t"><small class="sub danger-text" x-text="t"></small></template></td>
<td data-label="媒体信息"><template x-if="r.info&&r.verdict!=='error'"><span><span x-text="(r.info.video||'')+' · '+(r.info.container||'')"></span><small class="sub" x-text="'音轨：'+((r.info.audio||[]).join('，')||'无')"></small><small class="sub" x-show="(r.info.subtitles||[]).length" x-text="'字幕：'+(r.info.subtitles||[]).join('，')"></small></span></template></td>
<td data-label="兼容版"><template x-if="r.job_status"><span><span class="tag" :class="r.job_status==='done'?'online':r.job_status==='failed'?'offline':'warn'" x-text="jobLabels[r.job_status]+(['running','paused'].includes(r.job_status)?' '+(r.job_progress||0)+'%':'')"></span><small class="sub danger-text" x-show="r.job_error" x-text="r.job_error"></small><small class="sub" x-show="r.copy_route" x-text="(r.use_copy===false?'电视播放原文件':'电视播放兼容版')+(r.copy_bytes?' · '+sizeText(r.copy_bytes):'')+(r.copy_status==='stale'?' · 源文件已变化，需重新生成':'')"></small></span></template></td>
<td data-label="操作"><div class="row" x-show="writable"><button class="text-btn" @click="probeRows([r])">重新预检</button><button class="text-btn" x-show="['remux','audio','video'].includes(r.verdict)&&!['queued','running','paused'].includes(r.job_status)" @click="enqueueRows([r.id])" x-text="r.job_status==='done'?'重新生成':'生成兼容版'"></button><button class="text-btn" x-show="['queued','running'].includes(r.job_status)" @click="compatOp(r,'pause')">暂停</button><button class="text-btn" x-show="r.job_status==='paused'" @click="compatOp(r,'resume')">继续（从头）</button><button class="text-btn danger" x-show="['queued','running','paused'].includes(r.job_status)" @click="compatOp(r,'cancel')">取消</button><button class="text-btn" x-show="['failed','cancelled'].includes(r.job_status)" @click="compatOp(r,'retry')">重试</button><button class="text-btn" x-show="r.copy_route&&r.use_copy!==false&&r.copy_status==='ready'" @click="compatOp(r,'use_original')">改用原文件</button><button class="text-btn" x-show="r.copy_route&&r.use_copy===false&&r.copy_status==='ready'" @click="compatOp(r,'use_copy')">改用兼容版</button></div></td>
</tr></template></tbody></table><div class="empty-state" x-show="!compatRows.length&&!opsLoading">没有符合条件的文件。</div></div>
</div></template>
<template x-if="opsTab==='channels'"><div>
<div class="managed-head"><div><h2>频道</h2><p class="muted">本地虚拟直播：所有电视按同一时间表播出，客人只能切台、不能暂停或快进；点播不受影响。节目时长来自兼容预检，保存时会自动读取。</p></div><div class="head-actions"><button class="btn" @click="exportXmltv()">导出节目单 XMLTV</button><button class="btn primary" x-show="writable" @click="editChannel()">新建频道</button></div></div>
<div class="managed-table"><table><thead><tr><th>频道</th><th>编排</th><th>节目</th><th>正在播出 / 接下来</th><th>状态</th><th>操作</th></tr></thead><tbody><template x-for="c in channelRows" :key="c.id"><tr>
<td data-label="频道"><strong x-text="c.number+'  '+c.name"></strong><template x-for="w in c.warnings" :key="w"><small class="sub danger-text" x-text="w"></small></template></td>
<td data-label="编排"><span x-text="modeLabels[c.mode]"></span><small class="sub" x-text="(c.breaks?.enabled?('每 '+c.breaks.every+' 个节目插 '+c.breaks.seconds+' 秒广告时段'):'无自动节目间广告')+((c.inserts||[]).length?' · '+c.inserts.length+' 条指定插入':'')"></small></td>
<td data-label="节目" x-text="c.programmes+' 个 · '+(c.cycle_minutes>0?'一轮约 '+c.cycle_minutes+' 分钟':'一轮不到 1 分钟')"></td>
<td data-label="正在播出"><template x-for="e in c.preview.slice(0,2)" :key="e.start_ms"><small class="sub" x-text="channelTime(e.start_ms)+' '+e.title"></small></template></td>
<td data-label="状态"><span class="tag" :class="c.enabled?'online':'neutral'" x-text="c.enabled?'播出中':'已停用'"></span></td>
<td data-label="操作"><div class="row"><button class="text-btn" @click="openChannel(c)">节目单</button><template x-if="writable"><span class="row"><button class="text-btn" @click="editChannel(c)">编辑</button><button class="text-btn" @click="lifecycle('channel',c.enabled?'disable':'enable',[c.id])" x-text="c.enabled?'停用':'启用'"></button><button class="text-btn danger" @click="lifecycle('channel','archive',[c.id])">移入回收站</button></span></template></div></td>
</tr></template></tbody></table><div class="empty-state" x-show="!channelRows.length&&!opsLoading">暂无频道。</div></div>
</div></template>
<template x-if="opsTab==='trash'"><div>
<div class="managed-head"><div><h2>回收站</h2><p class="muted">删除先停止播放、投放或连接。恢复后仍保持未发布或停用。</p></div><div class="head-actions" x-show="administrator"><button class="btn" @click="clearTrash('expired')" :disabled="busy">清空到期记录</button><button class="btn" @click="clearTrash('all')" :disabled="busy||!(opsData.rows||[]).length">清空回收站</button></div></div>
<details class="panel policy-fold" x-show="administrator"><summary x-text="'清理规则：保留 '+policyDraft.trash_days+' 天 · '+(policyDraft.cleanup_enabled?'自动清理已开':'自动清理已关')"></summary><form class="managed-policy" @submit.prevent="savePolicy()" @input="markPolicy()"><label>保留天数<input class="form-input" type="number" min="1" max="365" x-model.number="policyDraft.trash_days" aria-label="回收站保留天数"></label><label class="check"><input type="checkbox" x-model="policyDraft.cleanup_enabled">到期自动清空索引</label><button class="btn" type="submit" :disabled="busy||opsLoading">保存清理规则</button><small class="form-hint">原影片、广告与备份文件保留；审计、观看事件不随对象清除。每小时检查到期记录，有引用时保留。未知删除时间的旧记录不会自动清理。</small></form></details>
<div class="managed-filters"><input class="form-input" x-model="opsQuery" placeholder="搜索已删除记录" aria-label="搜索回收站"><select class="form-input" x-model="opsStatus" aria-label="回收站类型"><option value="">全部类型</option><option value="media">影片</option><option value="campaign">广告任务</option><option value="advertiser">广告主</option><option value="asset">素材</option><template x-if="administrator"><optgroup label="管理员"><option value="source">片库来源</option><option value="category">分类</option><option value="group">设备组</option><option value="device">设备</option><option value="user">账号</option><option value="backup">备份</option></optgroup></template></select></div>
<div class="managed-table"><table><thead><tr><th>对象</th><th>类型</th><th>删除时间</th><th>计划清空</th><th>引用</th><th>操作</th></tr></thead><tbody><template x-for="r in visibleTrash" :key="r.kind+':'+r.id"><tr><td data-label="对象" x-text="r.name"></td><td data-label="类型" x-text="r.type"></td><td data-label="删除时间" x-text="mediaTime(r.archived_at)"></td><td data-label="计划清空" x-text="policyDraft.cleanup_enabled?mediaTime(r.expires_at):'自动清理已关闭'"></td><td data-label="引用" x-text="r.references?r.references+' 项，清理前需迁移':'无引用'"></td><td data-label="操作"><div class="row"><button class="text-btn" @click="lifecycle(r.kind,'restore',[r.id])" x-show="writable">恢复</button><button class="text-btn danger-text" @click="lifecycle(r.kind,'purge',[r.id])" x-show="administrator" :disabled="r.references>0">清空记录</button></div></td></tr></template></tbody></table><div class="empty-state" x-show="!visibleTrash.length">回收站为空或没有符合条件的记录。</div></div>
<details class="panel managed-details" x-show="administrator&&(opsData.ignored_media||[]).length"><summary>已清空影片的防重入标记</summary><p class="form-hint">这些影片不会被扫描或 Jellyfin 自动重新导入。允许重新入库后，可再次扫描；历史编辑信息不会恢复。</p><template x-for="r in opsData.ignored_media||[]" :key="r.id"><div class="managed-line"><strong x-text="r.name"></strong><button class="btn" @click="allowImport(r)">允许重新入库</button></div></template></details>
<p class="form-hint" x-show="data.maintenance.at">最近自动清理：<span x-text="date(data.maintenance.at)"></span> · 清空 <span x-text="data.maintenance.cleared||0"></span> 项 · 引用阻止 <span x-text="data.maintenance.blocked||0"></span> 项 <span x-show="data.maintenance.error" x-text="'执行异常：'+data.maintenance.error"></span></p>
</div></template>
<template x-if="opsTab==='tasks'"><div><div class="managed-head"><div><h2>任务中心</h2><p class="muted">排队、执行、完成和失败分别记录，原失败任务保留。</p></div><button class="btn primary" @click="oneClickLibrary()" x-show="writable" :disabled="busy">一键更新片库</button></div><div class="managed-filters"><input class="form-input" aria-label="搜索任务" x-model="opsQuery" placeholder="任务编号或错误信息"><select class="form-input" x-model="opsStatus" aria-label="任务状态"><option value="">全部状态</option><option value="queued">排队中</option><option value="running">执行中</option><option value="completed">已完成</option><option value="failed">失败</option></select><button class="btn" @click="opsPage=0;loadOperations()">查询任务</button></div><div class="managed-table"><table><thead><tr><th>任务</th><th>状态</th><th>开始 / 完成</th><th>结果与步骤</th><th>操作</th></tr></thead><tbody><template x-for="j in opsData.rows||[]" :key="j.id"><tr><td data-label="任务"><strong x-text="jobName(j)"></strong><small class="sub mono" :title="j.id" x-text="j.id"></small></td><td data-label="状态"><span class="tag" :class="j.status==='failed'?'offline':j.status==='completed'?'online':'neutral'" x-text="jobStatus(j.status)"></span></td><td data-label="时间"><span x-text="date(j.started)"></span><small class="sub" x-text="j.finished?date(j.finished):'尚未完成'"></small></td><td data-label="结果"><p x-text="j.error||('新增 '+(j.added||0)+' · 更新 '+(j.updated||0)+' · 缺失 '+(j.missing||0))"></p><details x-show="(j.steps||[]).length||(j.skipped_reasons||[]).length"><summary>查看执行明细</summary><template x-for="(step,i) in j.steps||[]" :key="i"><p class="task-step"><span x-text="step.name+' · '+jobStatus(step.status)"></span><small class="sub error-message" x-text="step.error"></small></p></template><template x-for="(reason,i) in j.skipped_reasons||[]" :key="i"><p class="task-step" x-text="reason.title+'：'+reason.reason"></p></template></details></td><td data-label="操作"><button class="text-btn" x-show="administrator&&j.status==='failed'" @click="retryTask(j)" :disabled="busy">重试任务</button></td></tr></template></tbody></table><div class="empty-state" x-show="!(opsData.rows||[]).length">暂无任务。</div></div></div></template>
<template x-if="opsTab==='audit'"><div><div class="managed-head"><div><h2>操作审计</h2><p class="muted">查询操作者、操作及对象；删除业务记录不会删除审计。</p></div><button class="btn" @click="exportAudit()">导出审计 CSV</button></div><div class="managed-filters"><input class="form-input" x-model="opsQuery" placeholder="搜索账号、动作或对象" aria-label="搜索审计"><button class="btn" @click="opsPage=0;loadOperations()">查询审计</button></div><div class="managed-table"><table><thead><tr><th>时间</th><th>操作者</th><th>动作</th><th>对象</th></tr></thead><tbody><template x-for="r in opsData.rows||[]" :key="r.id"><tr><td data-label="时间" x-text="date(r.at)"></td><td data-label="操作者" x-text="r.actor"></td><td data-label="动作" x-text="r.action"></td><td data-label="对象" x-text="r.object"></td></tr></template></tbody></table><div class="empty-state" x-show="!(opsData.rows||[]).length">暂无符合条件的审计记录。</div></div></div></template>
<div class="managed-pager" x-show="['tasks','audit'].includes(opsTab)"><button class="btn" :disabled="opsPage===0" @click="opsPage--;loadOperations()">上一页</button><span x-text="'共 '+(opsData.total||0)+' 项 · 第 '+(opsPage+1)+' 页'"></span><button class="btn" :disabled="(opsPage+1)*opsLimit>=(opsData.total||0)" @click="opsPage++;loadOperations()">下一页</button></div>
<template x-if="opsTab==='backups'"><div><div class="managed-head"><div><h2>数据库备份</h2><p class="muted">包含账号和设备凭证，请妥善保存。配置回退请到系统设置先预览差异。</p></div><button class="btn primary" @click="createBackup()" :disabled="busy">一键生成备份</button></div><div class="managed-table"><table><thead><tr><th>备份文件</th><th>生成时间</th><th>大小</th><th>操作</th></tr></thead><tbody><template x-for="r in (opsData.rows||[]).filter(r=>!r._archived)" :key="r.id"><tr><td data-label="备份" class="mono" x-text="r.name"></td><td data-label="时间" x-text="date(r.created_at)"></td><td data-label="大小" x-text="bytes(r.bytes)"></td><td data-label="操作"><div class="row"><button class="text-btn" @click="downloadBackup(r)">下载备份</button><button class="text-btn" @click="lifecycle('backup','archive',[r.id])">删除</button></div></td></tr></template></tbody></table><div class="empty-state" x-show="!(opsData.rows||[]).filter(r=>!r._archived).length">尚无可用备份。</div></div></div></template>
<template x-if="opsTab==='sync'"><div><div class="managed-head"><div><h2>Jellyfin 同步设置</h2><p class="muted">暂停只影响自动同步，手动更新仍可执行。</p></div><span class="tag" :class="syncDraft.configured?'online':'neutral'" x-text="syncDraft.configured?'已配置连接':'尚未配置'"></span></div><div class="managed-two-col"><form class="panel panel-pad form-stack" @submit.prevent="saveSync()" @input="markSync()"><h3>自动同步</h3><label class="form-label" for="sync-interval">同步间隔（秒）</label><input id="sync-interval" class="form-input" type="number" min="30" max="3600" x-model.number="syncDraft.interval_seconds"><label class="check"><input type="checkbox" x-model="syncDraft.paused">暂停自动同步</label><button class="btn primary" :disabled="busy" type="submit">保存同步设置</button><button class="btn" type="button" @click="syncJellyfin()" :disabled="busy||!syncDraft.configured">手动同步一次</button></form><form class="panel panel-pad form-stack" @submit.prevent="saveConnection()" @input="markSync()"><h3>本机连接</h3><label class="form-label" for="sync-url">Jellyfin 服务地址</label><input id="sync-url" class="form-input" x-model="syncDraft.url" placeholder="http://127.0.0.1:8096"><label class="form-label" for="sync-token">API 密钥（已配置时留空保留）</label><input id="sync-token" class="form-input" type="password" autocomplete="new-password" x-model="syncDraft.token"><button class="btn" type="submit" :disabled="busy||opsLoading">保存连接</button><button class="btn" type="button" @click="testConnection()" :disabled="busy">测试连接</button><p class="inline-notice" x-show="connectionResult" x-text="connectionResult?.message"></p></form></div></div></template>
<template x-if="opsTab==='health'"><div><div class="managed-head"><div><h2>服务器状态</h2><p class="muted">按需检查本机服务端口与存储，不对电视执行远程命令。</p></div><button class="btn" @click="loadOperations()">重新检测</button></div><template x-if="serverHealth"><div><p class="form-hint" x-text="serverHealth.hostname+' · '+serverHealth.system+' · '+date(serverHealth.checked_at)"></p><div class="managed-health-grid"><template x-for="s in serverHealth.services" :key="s.port"><article class="panel panel-pad"><h3 x-text="s.name"></h3><p class="mono" x-text="'127.0.0.1:'+s.port"></p><span class="tag" :class="s.reachable?'online':'offline'" x-text="s.status"></span></article></template></div><div class="managed-table"><table><thead><tr><th>存储来源</th><th>路径</th><th>可读</th><th>已用 / 总量</th><th>剩余</th></tr></thead><tbody><template x-for="d in serverHealth.disks" :key="d.path"><tr><td data-label="来源" x-text="d.name"></td><td data-label="路径" class="mono" x-text="d.path"></td><td data-label="可读" x-text="d.readable?'是':'否'"></td><td data-label="容量" x-text="bytes(d.used)+' / '+bytes(d.total)"></td><td data-label="剩余" x-text="bytes(d.free)"></td></tr></template></tbody></table></div><h3 class="managed-section-title">物理硬盘与分区</h3><p class="form-hint" x-show="serverHealth.physical_storage?.status!=='ok'" x-text="serverHealth.physical_storage?.message||'物理硬盘状态尚未取得'"></p><div class="managed-table" x-show="serverHealth.physical_storage?.status==='ok'"><table><thead><tr><th>硬盘</th><th>容量与状态</th><th>分区与挂载</th></tr></thead><tbody><template x-for="d in (serverHealth.physical_storage?.devices||[])" :key="d.path"><tr><td data-label="硬盘"><strong x-text="d.name+' · '+d.model"></strong><small class="sub" x-text="'序列号 '+d.serial"></small></td><td data-label="状态"><span x-text="bytes(d.size)"></span><small class="sub" x-text="d.system?'系统盘':d.mounted?'已挂载':'未挂载'"></small></td><td data-label="分区"><template x-for="p in (d.partitions.length?d.partitions:[d])" :key="p.name"><small class="sub"><span x-text="p.name+' · '+bytes(p.size)+' · '+(p.fstype||'未识别文件系统')+(p.label?' · '+p.label:'')"></span><span class="sub" x-text="p.mounts.join('、')||'未挂载'"></span></small></template></td></tr></template></tbody></table></div><p class="form-hint">在“NAS 与应用 → 硬盘管理”中使用 Ubuntu 账号管理。未识别文件系统不代表空盘，请先确认盘内资料。</p></div></template></div></template>
