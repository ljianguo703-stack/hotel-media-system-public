<div class="sponsor-preview-frame" x-data="sponsorPreview()" x-effect="[shownSponsorCard.title,shownSponsorCard.body,shownSponsorCard.contact,shownSponsorCard.logo,shownSponsorCard.qr].join();$nextTick(()=>measure(true))"><div class="sponsor-card-preview" x-ref="card" :style="{background:shownSponsorCard.accent,color:sponsorInk(shownSponsorCard.accent)}" role="img" aria-label="赞助商电视排版预览">
<img class="sponsor-main" x-show="shownSponsorCard.image" :src="shownSponsorCard.image||null" alt="商户主图片">
<div class="sponsor-copy"><img class="sponsor-logo" x-show="shownSponsorCard.logo" :src="shownSponsorCard.logo||null" alt="商户标志"><div class="sponsor-text-window" x-ref="window"><div class="sponsor-text-track" x-ref="track"><strong x-text="shownSponsorCard.title"></strong><p x-show="shownSponsorCard.body" x-text="shownSponsorCard.body"></p><b x-show="shownSponsorCard.contact" x-text="shownSponsorCard.contact"></b></div></div><div class="sponsor-qr" x-show="shownSponsorCard.qr"><img :src="shownSponsorCard.qr||null" alt="商户二维码"><span x-text="shownSponsorCard.qr_label"></span></div></div></div>
<p class="sponsor-reading-hint" x-show="distance>0">长文字将缓慢自动滚动，图片和二维码固定。完整一轮约 <strong x-text="readingSeconds"></strong> 秒。<span x-show="modal==='campaign'&&readingSeconds>edit.duration">当前广告仅 <span x-text="edit.duration"></span> 秒，可能未滚完。<button type="button" class="text-btn" :disabled="!writable" @click="edit.duration=Math.min(120,readingSeconds)">采用建议时长</button></span></p></div>
</div>
