width:100%;resize:vertical;min-height:58px}.mc-add-row{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-top:10px}.mc-file{position:relative;cursor:pointer}.mc-file.disabled{opacity:.5;pointer-events:none}.mc-file-name{flex:1 1 180px;margin:0;overflow-wrap:anywhere}.mc-kind{width:auto;min-width:130px}.mc-add-list{display:grid;gap:10px;margin-top:16px}.mc-add-item{display:grid;grid-template-columns:52px minmax(0,1fr) auto;gap:14px;align-items:center;border:1px solid var(--line);border-radius:8px;padding:10px 12px}.mc-add-art{width:52px;height:78px;border-radius:4px;background:var(--soft);overflow:hidden;display:block}.mc-add-art img{width:100%;height:100%;object-fit:cover;display:block}.mc-add-main{min-width:0;display:grid;gap:2px}.mc-add-main strong{font-size:14px;overflow-wrap:anywhere}.mc-add-main small{color:var(--muted);font-size:12px;overflow-wrap:anywhere}.mc-add-error{margin:2px 0 0;color:var(--red);font-size:12.5px;overflow-wrap:anywhere}.mc-add-side{display:flex;flex-direction:column;gap:6px;align-items:flex-end}@media(max-width:760px){.mc-steps,.mc-grid{grid-template-columns:1fr}.mc-issue{flex-direction:column;align-items:flex-start}.mc-add-item{grid-template-columns:44px minmax(0,1fr)}.mc-add-art{width:44px;height:66px}.mc-add-side{grid-column:1/-1;flex-direction:row;flex-wrap:wrap;align-items:center}.mc-kind{flex:1 1 140px}}</style>
<section>
<div class="page-head"><div><p class="eyebrow">MEDIA LIBRARY</p><h1>加片与下载</h1><p>搜索下载需要配置可用的资源源；没有搜索结果时，可贴磁力链接或上传种子。下载后核对正片、集号和资料，再确认上架。</p></div><div class="head-actions"><a class="btn primary" x-show="administrator" :href="mcNativeUrl('qbittorrent')" @click="requireService($event,'qbittorrent')" target="_blank" rel="noopener noreferrer">查看下载进度 ↗</a><button class="btn" @click="loadMediaCenter(true)" :disabled="mediaCenterLoading" x-text="mediaCenterLoading?'检查中…':'重新检查'"></button><button class="btn primary" @click="navigate('pending')" x-text="'待上架'+(mediaCenter&&mediaCenter.pending_publish?' '+mediaCenter.pending_publish+' 部':'')"></button></div></div>
<style>.mc-tools{margin-bottom:22px}.mc-tools-actions{display:flex;flex-wrap:wrap;gap:10px;padding:0 22px 14px}.mc-tools-help{margin:0;padding:0 22px 18px;color:var(--muted);font-size:13px;line-height:1.8;overflow-wrap:anywhere}@media(max-width:760px){.mc-tools-actions{padding:0 18px 14px}.mc-tools-help{padding:0 18px 18px}}</style>
<article class="panel mc-tools" role="region" aria-label="下载进度与搜索源" x-show="administrator"><div class="panel-head"><div><h2>下载进度与搜索源</h2><p>下载百分比、速度、暂停、继续和限速在下载器里查看和操作。</p></div></div>
<div class="mc-tools-actions">
<a class="btn primary" :href="mcNativeUrl('qbittorrent')" @click="requireService($event,'qbittorrent')" target="_blank" rel="noopener noreferrer">下载进度与控制 ↗</a>
<a class="btn" :href="mcNativeUrl('seerr','requests')" @click="requireService($event,'seerr')" target="_blank" rel="noopener noreferrer">加片请求记录 ↗</a>
<a class="btn" :href="mcNativeUrl('jackett')" @click="requireService($event,'jackett')" target="_blank" rel="noopener noreferrer">Jackett 资源搜索（需配置站点）↗</a>
<a class="btn" :href="mcNativeUrl('prowlarr')" @click="requireService($event,'prowlarr')" target="_blank" rel="noopener noreferrer">Prowlarr 资源搜索 ↗</a>
<a class="btn" :href="mcNativeUrl('radarr','activity/queue')" @click="requireService($event,'radarr')" target="_blank" rel="noopener noreferrer">电影下载队列 ↗</a>
<a class="btn" :href="mcNativeUrl('sonarr','activity/queue')" @click="requireService($event,'sonarr')" target="_blank" rel="noopener noreferrer">剧集下载队列 ↗</a>
</div><p class="mc-tools-help">Seerr 的“已请求”表示已登记需求，不代表正在下载。下载器里没有任务时，先查看电影或剧集队列，确认是否找到可用资源。也可以在 Jackett / Prowlarr 找到资源后发送到下载器，或复制磁力链接到下方“贴链接加片”。qBittorrent 如提示登录，请使用当前下载器账号密码。</p></article>
<div class="mc-steps">
<article class="mc-step"><h2><b>1</b>搜片请求，或贴链接</h2><p>打开 Seerr 搜索片名，进入影片详情并点“请求”；“已请求”的影片不用重复提交。也可以在下方粘贴磁力链接或上传种子。Seerr 登录账号与 Jellyfin 相同。</p><a class="btn" x-show="administrator" :href="serviceUrl('seerr')||'#remote-access'" @click="requireService($event,'seerr')" target="_blank" rel="noopener noreferrer">打开 Seerr ↗</a></article>
<article class="mc-step"><h2><b>2</b>查看下载与自动处理</h2><p>在上方“下载进度与控制”查看真实下载状态。完成后自动认片、归档并同步，字幕与兼容处理取决于片源和已配置的来源；认不出片名时，会在下方提示你确认。</p></article>
<article class="mc-step"><h2><b>3</b>确认后上架</h2><p>在“待上架”检查海报和简介，点“上架”，电视就能看到。</p><button class="btn" @click="navigate('pending')">去待上架</button></article>
</div>
<article class="panel mc-add" id="mc-add"><div class="panel-head"><div><h2>贴链接加片</h2><p>在别处找到资源后，把磁力链接贴在这里或上传种子文件。由内置 qBittorrent 下载；影视资源下完自动认片、归档，进入“待上架”（未上架），由你确认后上架。不是影视的文件只下载、不入库。</p></div></div>
<div class="panel-pad"><form class="mc-add-form" @submit.prevent="mcAddSubmit()"><label class="sr-only" for="mc-link">磁力链接</label><textarea id="mc-link" class="form-input mono" rows="2" x-model="mcAdd.link" placeholder="magnet:?xt=urn:btih:…" :disabled="!administrator||!!mcAdd.file"></textarea>
<div class="mc-add-row"><label class="btn mc-file" :class="{disabled:!administrator}">选择种子文件<input type="file" class="sr-only" accept=".torrent,application/x-bittorrent" x-ref="mcTorrent" @change="mcAdd.file=$event.target.files[0]||null" :disabled="!administrator"></label><span class="form-hint mc-file-name" x-text="mcAdd.file?('已选：'+mcAdd.file.name):'只支持磁力链接和 .torrent 种子；ed2k 与普通网址不支持'"></span><button type="button" class="text-btn" x-show="mcAdd.file" @click="mcAdd.file=null;$refs.mcTorrent.value=''">取消种子</button><select class="form-input mc-kind" x-model="mcAdd.kind" aria-label="影片类型"><option value="auto">自动判断类型</option><option value="movie">电影</option><option value="series">剧集</option><option value="file">普通文件（只下载）</option></select><button class="btn primary" type="submit" :disabled="busy||!administrator">开始下载</button></div></form>
<p class="form-hint" x-show="!administrator">贴链接加片需要管理员账号。</p><template x-if="mcAddError"><p class="inline-notice" x-text="mcAddError"></p></template>
<div class="mc-add-list" x-show="mcAddTasks.length"><template x-for="t in mcAddTasks" :key="t.id"><div class="mc-add-item"><span class="mc-add-art"><template x-if="t.match&&t.match.poster"><img :src="mcPoster(t.match.poster)" :alt="t.match.title" loading="lazy" @error="$el.remove()"></template></span><div class="mc-add-main"><strong x-text="t.match?(t.match.title+(t.match.year?'（'+t.match.year+'）':'')):(t.name||'正在获取资源信息…')"></strong><small class="mono" x-show="t.match&&t.name" x-text="t.name"></small><div class="mc-bar" x-show="!['imported','listed','downloaded'].includes(t.stage)"><span :style="'width:'+mcProgress(t)+'%'"></span></div><small x-text="mcDownloadText(t)"></small><p class="mc-add-error" x-show="t.error" x-text="t.error"></p><div x-show="administrator&amp;&amp;['needs_file','needs_episodes'].includes(t.stage)" class="field"><template x-if="t.stage==='needs_file'"><label>正片文件<select class="form-input" :aria-label="'选择正片 '+t.id" x-model="mcFileChoices[t.id]"><option value="">请选择</option><template x-for="f in (t.file_candidates||[])" :key="f.path"><option :value="f.path" x-text="f.path+' · '+bytes(f.size)"></option></template></select></label></template><template x-if="t.stage==='needs_episodes'"><div x-init="mcNumbering[t.id] ||= {season:1,start:1}"><p>将按下列顺序连续编号，请核对内容：</p><ol><template x-for="f in (t.file_candidates||[])" :key="f.path"><li x-text="f.path" style="overflow-wrap:anywhere"></li></template></ol><label>季号<input class="form-input" type="number" min="1" max="999" x-model.number="mcNumbering[t.id].season"></label><label>起始集号<input class="form-input" type="number" min="1" max="9999" x-model.number="mcNumbering[t.id].start"></label></div></template><button class="btn primary" :disabled="busy" @click="mcSelectFiles(t)">确认文件并继续入库</button></div><template x-for="n in (['imported','listed'].includes(t.stage)?(t.notes||[]).slice(1):[])" :key="n"><small x-text="n"></small></template></div><div class="mc-add-side"><span class="tag" :class="mcStage(t).cls" x-text="mcStage(t).label"></span><button class="btn" :class="{primary:t.stage==='needs_match'}" x-show="administrator&&mcCanPick(t)" @click="mcOpenPicker('match',t)" :disabled="busy" x-text="t.stage==='needs_match'?'选择片名':'改片名'"></button><button class="btn" x-show="t.stage==='listed'" @click="navigate(t.published?'media':'pending')" x-text="t.published?'查看片库':'去待上架'">去待上架</button><button class="text-btn" x-show="administrator&&t.stage==='failed'&&t.download?.state!=='missing'" @click="mcTaskAction(t,'retry')" :disabled="busy">重试</button><button class="text-btn" x-show="administrator&amp;&amp;t.stage==='failed'&amp;&amp;t.download?.state==='missing'" @click="mcGoAdd()">重新贴链接</button><button class="text-btn" x-show="administrator&&t.stage!=='importing'" @click="mcTaskAction(t,'remove')" :disabled="busy" x-text="mcKeepsFiles(t)?'从列表移除':'移除'"></button></div></div></template></div>
<p class="form-hint" x-show="mcAddLoaded&&!mcAddTasks.length">还没有贴链接加的片。</p></div></article>
<article class="panel"><div class="panel-head"><div><h2>需要处理</h2><p x-text="mediaCenterChecked"></p></div></div>
<template x-if="mediaCenterError"><p class="inline-notice" style="margin:0 22px 18px" x-text="mediaCenterError"></p></template>
<template x-if="mediaCenterChecked_&&!mediaCenterIssues.length"><p class="mc-ok">✓ 一切正常，没有需要你处理的事项。</p></template>
<div class="mc-issues" x-show="mediaCenterIssues.length"><template x-for="(issue,i) in mediaCenterIssues" :key="i+issue.title"><div class="mc-issue"><div><h3><span class="tag" :class="issue.level==='error'?'offline':'warn'" x-text="issue.level==='error'?'需处理':'注意'"></span><span x-text="issue.title"></span></h3><p x-text="issue.detail"></p></div><button class="btn" x-show="mcActionLabel(issue.action)" @click="mcIssueAction(issue)" :disabled="busy||mediaCenterLoading||(mcAdminAction(issue.action)&&!administrator)" x-text="mcActionLabel(issue.action)"></button></div></template></div>
<div class="mc-services"><template x-for="s in (mediaCenter&&mediaCenter.services||[])" :key="s.id"><span class="tag" :class="s.ok?'live':'offline'" :title="s.detail" x-text="s.name+(s.ok?' 正常':' 异常')"></span></template></div>
</article>
<div class="mc-grid">
<article class="panel"><div class="panel-head"><div><h2>片源规则</h2><p>自动挑资源时如何对待 HEVC（x265）。只影响之后的新请求，你自己下载的片子不受限制。</p></div></div><div class="panel-pad">
<template x-for="(label,key) in (mediaCenter&&mediaCenter.policy&&mediaCenter.policy.choices||{})" :key="key"><label class="mc-choice"><input type="radio" name="mc-hevc" :value="key" x-model="mcPolicy" :disabled="!administrator"><span><strong x-text="label"></strong><small x-text="mcPolicyHelp[key]"></small></span></label></template>
<button class="btn primary" x-show="administrator" style="margin-top:10px" :disabled="busy||!mediaCenter||mcPolicy===(mediaCenter.policy&&mediaCenter.policy.hevc)" @click="mediaCenterAction('set_policy',{hevc:mcPolicy})">保存片源规则</button>
</div></article>
<article class="panel"><div class="panel-head"><div><h2>字幕与语言</h2><p>已有字幕优先使用。缺失字幕由 Bazarr 在后台联网补充，播放无需等待搜索。</p></div></div><div class="panel-pad form-stack">
<p class="muted">新片以简体中文为目标，繁体中文可回退；现有单片规则保留。国语配音使用影片已有音轨，缺少时保留原声，可在 Radarr / Sonarr 查找国语版本。</p>
<div class="mc-tags"><span class="tag" :class="mediaCenter?.subtitles?.policy_ready?'live':'neutral'" x-text="mediaCenter?.subtitles?.policy_ready?'中文默认规则 已配置':'中文默认规则 待配置'"></span><span class="tag" :class="mediaCenter?.subtitles?.auto_sync?'live':'neutral'" x-text="mediaCenter?.subtitles?.auto_sync?(mediaCenter?.subtitles?.auto_sync_scope==='score_limited'?'自动校时 仅低匹配':'自动校时 已启用'):'自动校时 未启用'"></span></div>
<p class="muted" x-text="mcSubtitleWanted"></p>
<div x-show="administrator"><button class="btn primary" :disabled="busy||!mediaCenter" @click="mediaCenterAction('subtitle_policy')">启用中文默认规则与自动校时</button> <button class="btn" :disabled="busy||!mediaCenter?.subtitles?.online_sources?.length" @click="mediaCenterAction('search_subtitles')">搜索缺失字幕</button></div>
<p class="muted">新下载字幕按音频尝试校时，已有字幕需单独校时。“仅低匹配”表示高分字幕可能跳过；不同剪辑版仍需核对。来源显示“已启用”仅表示已配置，不代表每部影片都能匹配。</p>
<p class="muted">在线来源需要已有账号或 Token；留空保留当前凭据。</p>
<div class="mc-tags"><span class="tag" :class="mediaCenter&&mediaCenter.subtitles&&mediaCenter.subtitles.embedded?'live':'neutral'">内嵌字幕</span><span class="tag" :class="mediaCenter&&mediaCenter.subtitles&&mediaCenter.subtitles.assrt?'live':'neutral'" x-text="mediaCenter&&mediaCenter.subtitles&&mediaCenter.subtitles.assrt?'射手网 已启用':'射手网 未启用'"></span><span class="tag" :class="mediaCenter&&mediaCenter.subtitles&&mediaCenter.subtitles.opensubtitlescom?'live':'neutral'" x-text="mediaCenter&&mediaCenter.subtitles&&mediaCenter.subtitles.opensubtitlescom?'OpenSubtitles 已启用':'OpenSubtitles 未启用'"></span></div>
<label class="form-label" for="mc-assrt">射手网（Assrt）API Token</label><input id="mc-assrt" class="form-input" type="password" autocomplete="off" x-model="mcSubtitles.assrt_token" placeholder="在 assrt.net 注册后获取；留空不修改" :disabled="!administrator">
<label class="form-label" for="mc-os-user">OpenSubtitles.com 用户名</label><input id="mc-os-user" class="form-input" autocomplete="off" x-model="mcSubtitles.opensubtitles_username" placeholder="留空不修改" :disabled="!administrator">
<label class="form-label" for="mc-os-pass">OpenSubtitles.com 密码</label><input id="mc-os-pass" class="form-input" type="password" autocomplete="new-password" x-model="mcSubtitles.opensubtitles_password" :disabled="!administrator">
<div x-show="administrator"><button class="btn primary" :disabled="busy||!mcSubtitlesDirty" @click="mcSaveSubtitles()">保存字幕源</button> <button class="text-btn" x-show="mediaCenter&&mediaCenter.subtitles&&(mediaCenter.subtitles.assrt||mediaCenter.subtitles.opensubtitlescom)" @click="mcDisableSubtitles()">关闭在线字幕源</button></div>
</div></article>
</div>
<article class="panel" style="margin-top:18px"><div class="panel-head"><div><h2>存储空间</h2><p>兼容副本与影片放在同一块数据盘；空间不足时新片会暂停处理，腾出空间后自动继续。</p></div><button class="btn" @click="mcIssueAction({action:'view:cleanup'})">清理冷门影片</button></div><div class="panel-pad">
<template x-for="d in (mediaCenter&&mediaCenter.storage||[])" :key="d.label"><div class="mc-disk"><div><strong x-text="d.label"></strong><span x-text="d.total?('可用 '+bytes(d.free)+' / 共 '+bytes(d.total)):'不可用'"></span></div><div class="mc-bar"><span :style="'width:'+mcUsed(d)+'%'"></span></div><small class="mono" x-text="(d.paths||[]).join('  ·  ')"></small></div></template>
<p class="muted" x-show="!(mediaCenter&&mediaCenter.storage&&mediaCenter.storage.length)">正在读取…</p>
</div></article>
<h2 style="margin:26px 0 12px;font-size:15px">原生应用（出问题或需要细调时再打开）</h2>
<div class="stats-grid nas-services">
<template x-for="tool in [{id:'seerr',name:'Seerr 加片',text:'搜索片名并请求，查看需求状态。'},{id:'radarr',name:'Radarr 电影',text:'查看电影下载、质量和自动改名。'},{id:'sonarr',name:'Sonarr 剧集',text:'查看剧集、季集和自动归档。'},{id:'bazarr',name:'Bazarr 字幕',text:'识别内嵌字幕，管理已配置的在线字幕源。'},{id:'qbittorrent',name:'qBittorrent',text:'查看下载进度、速度，暂停、继续和管理做种。'},{id:'jackett',name:'Jackett 搜索源',text:'添加和测试资源站点，也可手动搜索资源。'},{id:'prowlarr',name:'Prowlarr 索引',text:'搜索资源、测试站点和发送下载。'},{id:'ariang',name:'AriaNg 直链下载',text:'查看和管理 aria2 下载任务。'}]" :key="tool.id"><article class="stat-card"><h2 x-text="tool.name"></h2><p x-text="tool.text"></p><a class="btn" x-show="administrator" :href="serviceUrl(tool.id)||'#remote-access'" @click="requireService($event,tool.id)" target="_blank" rel="noopener noreferrer">打开 ↗</a></article></template>
</div>
<article class="panel"><div class="panel-head"><div><h2>原有下载记录</h2><p>新片使用 Seerr 或上方“贴链接加片”。旧任务记录保留，不自动整理或上架。</p></div><button class="btn" @click="openOperations('tasks')">查看任务中心</button></div></article>
</section>
</div></template><template x-if="!data.media_automation"><div class="dl-page" x-data="{legacy:false}" x-effect="if(!legacy)clearInterval(dlTimer)">
<style>.dl-native-tools{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px;margin-bottom:24px}.dl-native-help{display:grid;gap:16px;padding:24px}.dl-native-help>div{font-size:13px;line-height:1.85;color:var(--muted);overflow-wrap:anywhere}.dl-native-help strong{display:block;color:var(--ink);margin-bottom:5px}.dl-native-help p{margin:10px 0 0}@media(max-width:700px){.dl-native-tools{grid-template-columns:1fr}.dl-native-help{padding:18px}}</style>
<section x-show="!legacy">
  <div class="page-head"><div><p class="eyebrow">DOWNLOAD TOOLS</p><h1>搜索与下载</h1><p>在 qBittorrent 的「搜索」页选择资源，直接开始下载。</p></div></div>
  <template x-if="administrator"><div>
    <div class="dl-native-tools nas-services">

<div class="form-grid"><label>同时下载数<input class="form-input" type="number" min="1" max="10" x-model.number="dlSettings.concurrent_downloads"></label><label>总限速（KB/s，0 不限）<input class="form-input" type="number" min="0" x-model.number="dlSettings.speed_limit_kbps"></label><label>磁盘最少保留（GB）<input class="form-input" type="number" min="0" x-model.number="dlSettings.min_free_gb"></label></div>
<p class="form-hint">新任务默认只下载；整理和上架在任务中单独选择。更改默认位置不会移动或改变已有任务。</p>
<details class="dl-advanced"><summary>搜索源与下载器连接</summary><div class="form-stack"><h3 class="managed-section-title">搜索源</h3>
<p class="form-hint">公开源无需账号或 API Key，添加后保存，再点测试。各站覆盖不同，系统会合并相同资源；结果与做种情况以实测为准。</p>
<div class="row"><template x-for="(p,type) in dlSourcePresets" :key="type"><button type="button" class="btn" @click="dlAddSource(type)" x-text="'添加 '+p.name"></button></template></div>
<template x-for="(s,i) in dlSettings.sources" :key="s.id"><div class="panel dl-service"><div class="form-grid"><div><label class="form-label">类型</label><select class="form-input" x-model="s.type" @change="dlSourceChanged(s)"><option value="prowlarr">Prowlarr</option><option value="torznab">Torznab</option><option value="knaben">Knaben 聚合</option><option value="apibay">ApiBay</option><option value="nyaa">Nyaa RSS</option><option value="btsearch">BTSearch 中文索引</option></select></div><div><label class="form-label">名称</label><input class="form-input" x-model="s.name"></div>
<div :class="{'dl-public-url':dlSourcePresets[s.type]}"><label class="form-label" x-text="dlSourceLabel(s.type)"></label><input class="form-input" x-model="s.url" @input="delete dlHealth['source:'+s.id]"></div><div x-show="!dlSourcePresets[s.type]"><label class="form-label">API Key</label><input class="form-input" type="password" autocomplete="new-password" :placeholder="dlSecretsPresent.sources?.[s.id]?'已保存（留空不修改）':'未设置'" @input="dlSecrets.sources[s.id]=$event.target.value"></div></div>
<p class="form-hint" x-show="dlSourcePresets[s.type]" x-text="dlSourcePresets[s.type]?.hint+' · 无需 API Key'"></p>
<div class="row"><label class="check"><input type="checkbox" x-model="s.enabled">启用</label><button type="button" class="text-btn" @click="dlTest('source:'+s.id)">测试</button><span class="tag" :class="dlHealthClass('source:'+s.id)"><span x-text="dlHealthText('source:'+s.id)"></span></span><button type="button" class="text-btn danger" @click="dlSettings.sources.splice(i,1)">移除</button></div></div></template>
<div class="row"><button type="button" class="btn" @click="dlAddSource('prowlarr')">添加 Prowlarr</button><button type="button" class="btn" @click="dlAddSource('torznab')">添加 Torznab</button></div>
<h3 class="managed-section-title">下载器</h3>
<div class="panel dl-service"><strong>qBittorrent（BT / 磁力，负责做种）</strong><div class="form-grid"><div><label class="form-label">WebUI 地址</label><input class="form-input" x-model="dlSettings.engines.qbittorrent.url" placeholder="http://127.0.0.1:8098"></div><div><label class="form-label">用户名</label><input class="form-input" autocomplete="off" x-model="dlSettings.engines.qbittorrent.username"></div>
<div><label class="form-label">密码</label><input class="form-input" type="password" autocomplete="new-password" :placeholder="dlSecretsPresent.qbittorrent?.password?'已保存（留空不修改）':'未设置'" x-model="dlSecrets.qbittorrent.password"></div><div><label class="form-label">下载器内目录 → 本机目录</label><input class="form-input" x-model="dlSettings.engines.qbittorrent.directory" placeholder="/downloads"><input class="form-input" x-model="dlSettings.engines.qbittorrent.host_directory" placeholder="本机暂存目录（空=默认暂存目录）"></div></div>
<div class="row"><label class="check"><input type="checkbox" x-model="dlSettings.engines.qbittorrent.enabled">启用</label><button type="button" class="text-btn" @click="dlTest('qbittorrent')">测试</button><span class="tag" :class="dlHealthClass('qbittorrent')"><span x-text="dlHealthText('qbittorrent')"></span></span></div></div>
<div class="panel dl-service"><strong>aria2（http/https 直链）</strong><div class="form-grid"><div><label class="form-label">JSON-RPC 地址</label><input class="form-input" x-model="dlSettings.engines.aria2.url" placeholder="http://127.0.0.1:6800/jsonrpc"></div><div><label class="form-label">RPC 密钥</label><input class="form-input" type="password" autocomplete="new-password" :placeholder="dlSecretsPresent.aria2?.secret?'已保存（留空不修改）':'未设置'" x-model="dlSecrets.aria2.secret"></div>
<div><label class="form-label">下载器内目录 → 本机目录</label><input class="form-input" x-model="dlSettings.engines.aria2.directory" placeholder="/downloads"><input class="form-input" x-model="dlSettings.engines.aria2.host_directory" placeholder="本机暂存目录（空=默认暂存目录）"></div></div>
<div class="row"><label class="check"><input type="checkbox" x-model="dlSettings.engines.aria2.enabled">启用</label><button type="button" class="text-btn" @click="dlTest('aria2')">测试</button><span class="tag" :class="dlHealthClass('aria2')"><span x-text="dlHealthText('aria2')"></span></span></div></div>
<p class="form-hint">下载只使用开源工具：qBittorrent 负责 BT / 磁力并继续做种，aria2 负责 http/https 直链。</p>
</div></details>
<details class="dl-advanced"><summary>旧任务整理与兼容设置</summary><div class="form-stack"><label class="check"><input type="checkbox" x-model="dlSettings.auto_mode">旧流程自动选源</label><label class="check"><input type="checkbox" x-model="dlSettings.auto_publish">旧流程自动上架</label><label class="check"><input type="checkbox" x-model="dlSettings.compat_auto">整理视频时自动生成兼容版本</label><h3 class="managed-section-title">目录</h3>
<label class="form-label" for="dls-stage">暂存目录（片库内必须是以 . 开头的隐藏目录，扫描器和 Jellyfin 都看不到）</label><input id="dls-stage" class="form-input" x-model="dlSettings.staging_dir">
<div class="form-grid"><div><label class="form-label" for="dls-mdir">电影目录</label><input id="dls-mdir" class="form-input" x-model="dlSettings.movie_dir"></div><div><label class="form-label" for="dls-mcat">电影分类</label><input id="dls-mcat" class="form-input" x-model="dlSettings.movie_category"></div><div><label class="form-label" for="dls-sdir">电视剧目录</label><input id="dls-sdir" class="form-input" x-model="dlSettings.series_dir"></div></div>
</div></details>
<button class="btn primary" type="submit" :disabled="busy">保存设置</button></form></template>
</div></div>
<div class="dl-overlay dl-folder-overlay" x-show="dlFolder.open" x-cloak @click.self="dlCloseFolder()"><div class="dl-dialog dl-folder-dialog" role="dialog" aria-modal="true" aria-label="选择保存位置">
<button class="btn dl-close" aria-label="关闭位置选择" @click="dlCloseFolder()">×</button><h2>选择保存位置</h2>
<div class="form-stack"><label for="dlf-root">硬盘或位置<select id="dlf-root" class="form-input" :value="dlFolder.root" @change="dlBrowse('', $event.target.value)"><template x-for="r in dlFolder.roots" :key="r.id"><option :value="r.id" :disabled="!r.available" x-text="r.name"></option></template></select></label>
<p class="form-hint">未挂载的硬盘会显示在列表中；挂载后刷新即可选择。</p><a class="text-btn" :href="serviceUrl('cockpit') || '#remote-access'" @click="requireService($event,'cockpit')" :class="{'access-missing':!serviceUrl('cockpit')}" target="_blank" rel="noopener" x-show="administrator">打开硬盘管理 ↗</a>
<div class="row"><button class="btn" :disabled="!dlFolder.parent||dlFolder.loading" @click="dlBrowse(dlFolder.parent,dlFolder.root)">上一级</button><input class="form-input" aria-label="当前文件夹" :value="dlFolder.path" readonly></div>
<label for="dlf-child">文件夹<select id="dlf-child" class="form-input" :disabled="dlFolder.loading" @change="if($event.target.value)dlBrowse($event.target.value,dlFolder.root);$event.target.value=''"><option value="">选择下一级文件夹…</option><template x-for="f in dlFolder.folders" :key="f.path"><option :value="f.path" :disabled="f.accessible===false" x-text="f.name+(f.accessible===false?'（无读取权限）':'')"></option></template></select></label>
<small class="sub" x-text="dlFolder.loading?'正在读取…':dlFolder.folders.length+' 个子文件夹'+(dlFolder.free_bytes==null?'':' · 可用 '+dlBytes(dlFolder.free_bytes))"></small>
<div class="dl-new-folder" x-show="administrator"><input class="form-input" x-model="dlFolder.newName" placeholder="新文件夹名称" aria-label="新文件夹名称" maxlength="100" @keydown.enter.stop="if(!$event.isComposing)dlNewFolder()"><button class="btn" :disabled="busy||!dlFolder.writable||!dlFolder.newName.trim()" @click="dlNewFolder()">新建并进入</button></div>
<p class="inline-notice failure" x-show="dlFolder.error" x-text="dlFolder.error"></p><p class="form-hint" x-show="!dlFolder.writable&&!dlFolder.loading">此位置当前不可写，请选择其他文件夹或调整挂载权限。</p>
<div class="row"><button class="btn primary" :disabled="dlFolder.loading||!dlFolder.writable" @click="dlChooseFolder()">使用此文件夹</button><button class="btn" @click="dlCloseFolder()">取消</button></div>
</div></div></div>
</div></template>
</div>
</template></div>
