<div class="console-directory"><div class="page-head"><div><h1 x-text="view==='console-all'?'全部功能':'设置中心'"></h1><p>按业务模块找到功能，也可以直接搜索旧菜单名称。</p></div><button class="btn" @click="view==='console-all'?openConsoleSettings():openConsoleAll()" x-text="view==='console-all'?'设置中心':'全部功能'"></button></div><div class="console-favorites"><span>☆ 常用入口</span><template x-for="i in consoleFavorites" :key="i.id"><button @click="openConsole(i.id)" x-text="i.name"></button></template></div><div class="setting-grid" x-show="view==='console-settings'"><article class="setting-card"><header><h2>账号与安全</h2></header><div class="entry-list"><template x-if="consoleItems.some(i=>i.id==='passwords')"><button class="entry" @click="openConsole('passwords')"><span>密码与电视 PIN</span><span>›</span></button></template><template x-if="consoleItems.some(i=>i.id==='users')"><button class="entry" @click="openConsole('users')"><span>账号与权限</span><span>›</span></button></template><template x-if="consoleItems.some(i=>i.id==='audit')"><button class="entry" @click="openConsole('audit')"><span>操作审计</span><span>›</span></button></template></div></article><article class="setting-card"><header><h2>电视与播放</h2></header><div class="entry-list"><template x-if="consoleItems.some(i=>i.id==='home')"><button class="entry" @click="openConsole('home')"><span>电视首页与指南</span><span>›</span></button></template><template x-if="consoleItems.some(i=>i.id==='ad_playback')"><button class="entry" @click="openConsole('ad_playback')"><span>广告播放规则</span><span>›</span></button></template><template x-if="consoleItems.some(i=>i.id==='guest_requests')"><button class="entry" @click="openConsole('guest_requests')"><span>观众留言</span><span>›</span></button></template></div></article><article class="setting-card"><header><h2>片库与存储</h2></header><div class="entry-list"><template x-if="consoleItems.some(i=>i.id==='sources')"><button class="entry" @click="openConsole('sources')"><span>影片接入与扫描</span><span>›</span></button></template><template x-if="consoleItems.some(i=>i.id==='sync')"><button class="entry" @click="openConsole('sync')"><span>Jellyfin 同步</span><span>›</span></button></template><template x-if="consoleItems.some(i=>i.id==='disks')"><button class="entry" @click="openConsole('disks')"><span>硬盘管理</span><span>›</span></button></template></div></article><article class="setting-card"><header><h2>连接与远程</h2></header><div class="entry-list"><template x-if="consoleItems.some(i=>i.id==='remote')"><button class="entry" @click="openConsole('remote')"><span>NPS 穿透</span><span>›</span></button></template><template x-if="consoleItems.some(i=>i.id==='ports')"><button class="entry" @click="openConsole('ports')"><span>端口与公网入口</span><span>›</span></button></template><template x-if="consoleItems.some(i=>i.id==='shared')"><button class="entry" @click="openConsole('shared')"><span>电脑共享</span><span>›</span></button></template></div></article><article class="setting-card"><header><h2>备份与维护</h2></header><div class="entry-list"><template x-if="consoleItems.some(i=>i.id==='backups')"><button class="entry" @click="openConsole('backups')"><span>数据库备份</span><span>›</span></button></template><template x-if="consoleItems.some(i=>i.id==='releases')"><button class="entry" @click="openConsole('releases')"><span>配置历史与恢复</span><span>›</span></button></template><template x-if="consoleItems.some(i=>i.id==='software')"><button class="entry" @click="openConsole('software')"><span>软件与更新</span><span>›</span></button></template></div></article><article class="setting-card"><header><h2>基础与记录</h2></header><div class="entry-list"><template x-if="consoleItems.some(i=>i.id==='general')"><button class="entry" @click="openConsole('general')"><span>酒店与时区</span><span>›</span></button></template><template x-if="consoleItems.some(i=>i.id==='tasks')"><button class="entry" @click="openConsole('tasks')"><span>任务中心</span><span>›</span></button></template><template x-if="consoleItems.some(i=>i.id==='trash')"><button class="entry" @click="openConsole('trash')"><span>回收站</span><span>›</span></button></template></div></article></div><div class="console-all-grid" x-show="view==='console-all'"><template x-for="g in consoleGroups" :key="g.id"><article class="setting-card"><header><h2 x-text="g.name"></h2></header><div class="entry-list"><template x-for="i in g.items" :key="i.id"><div class="console-directory-entry"><button class="entry" @click="openConsole(i.id)" x-text="i.name"></button><button class="console-star" @click="toggleConsoleFavorite(i.id)" :aria-pressed="consoleFavoriteIds.includes(i.id)" :aria-label="'收藏'+i.name" x-text="consoleFavoriteIds.includes(i.id)?'★':'☆'"></button></div></template></div></article></template></div></div>
