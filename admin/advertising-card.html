<section class="form-stack ad-card-editor"><h3>图文广告内容</h3><p class="form-hint">直接编辑赞助商资料，或切换成品图片/视频。素材保存在本机素材库。</p>
<label class="form-label" for="card-title">赞助商标题（必填）</label><input id="card-title" class="form-input" maxlength="80" aria-required="true" x-model="edit.creative_card.title" :disabled="!writable"><p class="form-hint">填赞助商名称或广告标题，最多 80 个字符；只上传图片时，也需填写标题。已有整张海报可切换为“成品图片”。</p>
<label class="form-label" for="card-body">宣传文字</label><textarea id="card-body" class="form-input" rows="3" maxlength="500" x-model="edit.creative_card.body" :disabled="!writable"></textarea>
<label class="form-label" for="card-contact">联系方式 / 地址</label><textarea id="card-contact" class="form-input" rows="2" maxlength="300" x-model="edit.creative_card.contact" :disabled="!writable"></textarea>
<template x-for="field in [{key:'image',name:'主图片'},{key:'logo',name:'商户 Logo'},{key:'qr',name:'二维码原图'}]" :key="field.key"><div class="form-stack"><label class="form-label" :for="'card-'+field.key" x-text="field.name"></label><input :id="'card-'+field.key" type="file" accept="image/png,image/jpeg,image/webp" @change="uploadCard($event.target.files[0],field.key);$event.target.value=''" :disabled="uploading||!writable"><div class="row" x-show="edit.creative_card[field.key]"><img class="ad-material-thumb" :src="edit.creative_card[field.key]" :alt="field.name"><button type="button" class="text-btn danger-text" @click="edit.creative_card[field.key]=''" :disabled="!writable">移除绑定</button></div></div></template>
<label class="form-label" for="card-link">或由链接生成二维码</label><input id="card-link" class="form-input" type="url" placeholder="https://" x-model="edit.creative_card.qr_link" :disabled="!writable"><p class="form-hint">填写后保存生成本地二维码；留空则使用上传原图。链接内容由你决定。</p><label class="form-label" for="card-qrlabel">二维码说明</label><input id="card-qrlabel" class="form-input" maxlength="40" x-model="edit.creative_card.qr_label" :disabled="!writable"><label class="form-label" for="card-accent">背景色</label><input id="card-accent" type="color" x-model="edit.creative_card.accent" :disabled="!writable">
<h3>电视排版预览</h3><div x-html="cardPreviewMarkup"></div><p class="form-hint">图片按原比例完整显示，允许留边；长文字缓慢滚动，图片和二维码固定。广告时长由你设置，保存后可预览生成的二维码。</p></section>
