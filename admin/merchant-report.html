<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>商户投放报告</title>
<style>
:root{--ink:#1f2a37;--muted:#667487;--line:#dfe4ea;--soft:#f5f7fa;--gold:#987231;--red:#a74436;--green:#3f7a5f}
*{box-sizing:border-box}body{margin:0;background:#eef1f4;color:var(--ink);font:14px/1.6 -apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif}
.toolbar{position:sticky;top:0;z-index:2;display:flex;flex-wrap:wrap;gap:8px;align-items:end;padding:12px 16px;background:#1d2733;color:#dfe5ee}
.toolbar label{display:flex;flex-direction:column;font-size:11px;gap:4px}.toolbar input{font:inherit;padding:6px 8px;border-radius:6px;border:1px solid #415064;background:#26313f;color:#fff}
.toolbar button,.toolbar a{font:inherit;font-size:13px;padding:7px 12px;border-radius:6px;border:1px solid #556479;background:#2c394a;color:#fff;text-decoration:none;cursor:pointer}.toolbar .primary{background:var(--gold);border-color:var(--gold)}
.sheet{max-width:960px;margin:20px auto;background:#fff;padding:36px 40px;border-radius:10px;box-shadow:0 2px 14px #1f2a3712}
h1{font-size:24px;margin:4px 0 6px}h2{font-size:17px;margin:28px 0 10px;padding-top:16px;border-top:1px solid var(--line)}h3{font-size:14px;margin:16px 0 8px}
.eyebrow{font-size:12px;letter-spacing:1px;color:var(--gold);margin:0}.meta{color:var(--muted);font-size:12px;margin:0}
.cards{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:10px;margin:22px 0 4px}.card{border:1px solid var(--line);border-radius:8px;padding:12px}.card b{display:block;font-size:22px}.card span{font-size:11px;color:var(--muted)}
table{width:100%;border-collapse:collapse;margin:6px 0 4px;font-size:12px}th,td{text-align:left;padding:7px 8px;border-bottom:1px solid var(--line);vertical-align:top;overflow-wrap:anywhere}th{background:var(--soft);font-weight:600;color:#4f5d6f;font-size:11px}td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}
.bar{height:6px;background:#e8edf2;border-radius:3px;overflow:hidden;width:160px;display:inline-block;vertical-align:middle;margin-right:8px}.bar i{display:block;height:100%;background:var(--gold)}
.note{font-size:11px;color:var(--muted);margin-top:24px;line-height:1.8}.warn{color:var(--red);font-size:12px;margin:4px 0}.empty{padding:24px;text-align:center;color:var(--muted);background:var(--soft);border-radius:8px;margin-top:18px}
.error{max-width:960px;margin:40px auto;padding:20px;background:#fff2f0;color:var(--red);border-radius:8px}
@media(max-width:700px){.sheet{margin:0;border-radius:0;padding:22px 16px}.cards{grid-template-columns:repeat(2,minmax(0,1fr))}.bar{width:90px}table{font-size:11px}th,td{padding:6px 5px}}
@media print{body{background:#fff}.toolbar{display:none}.sheet{box-shadow:none;margin:0;max-width:none;padding:0}@page{size:A4;margin:14mm}h2{break-after:avoid}tr{break-inside:avoid}}
</style>
</head>
<body>
<form class="toolbar" id="controls">
<a href="./?view=operations&amp;tab=orders">返回后台</a>
<label>开始日期<input type="date" name="from" required></label>
<label>结束日期<input type="date" name="until" required></label>
<button type="submit">更新报告</button>
<button type="button" class="primary" id="print">打印 / 存为 PDF</button>
<button type="button" id="csv">下载每日明细 CSV</button>
</form>
<main id="report" aria-live="polite"><p class="meta" style="text-align:center;margin-top:40px">正在生成报告…</p></main>
<script src="merchant-report.js"></script>
</body>
</html>
