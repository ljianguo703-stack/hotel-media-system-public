<div class="page-head"><div><h1>客房设备</h1><p>管理设备组、接入凭证和连接状态。</p></div><div class="head-actions"><button class="btn primary" @click="navigate('fleet')" x-show="administrator">批量运维与通知</button><button class="btn" @click="openOperations('groups')" x-show="administrator">设备组</button><button class="btn" @click="exportDevices()" x-show="administrator">导出设备</button><button class="btn" @click="openCsv()" x-show="administrator">CSV 导入</button><button class="btn primary" @click="openDevice()" x-show="administrator">登记设备</button></div></div>
<div class="managed-filters"><input class="form-input" x-model="deviceSearch" aria-label="搜索客房" placeholder="搜索房号、标识或设备组"><select class="form-input" aria-label="设备组筛选" x-model="deviceGroup"><option value="">全部设备组</option><template x-for="g in groups" :key="g"><option :value="g" x-text="g"></option></template></select><select class="form-input" x-model="deviceStatus" aria-label="设备状态"><option value="">全部状态</option><option value="online">在线</option><option value="offline">离线</option><option value="disabled">停用</option></select><div class="view-switch"><button class="btn" :class="{selected:deviceView==='table'}" @click="deviceView='table'">列表</button><button class="btn" :class="{selected:deviceView==='matrix'}" @click="deviceView='matrix'">房间矩阵</button></div></div>
<div class="library-count"><label class="check" x-show="administrator"><input type="checkbox" :checked="filteredDevices.length>0&&filteredDevices.every(d=>deviceSelected.includes(d.id))" @change="selectSet('deviceSelected',filteredDevices.map(d=>d.id))">全选当前筛选结果</label><span x-text="'共 '+filteredDevices.length+' 台 · 已选 '+deviceSelected.length+' 台'"></span></div>
<div class="room-matrix" x-show="deviceView==='matrix'"><template x-for="d in filteredDevices" :key="d.id"><button class="room-cell" :class="d.enabled&&d.online?'is-online':!d.enabled?'is-disabled':''" @click="administrator?showDevice(d):openDevice(d)"><strong x-text="d.room"></strong><span x-text="!d.enabled?'停用':d.online?'在线':'离线'"></span><small x-text="d.group"></small></button></template></div>
<div class="managed-table" x-show="deviceView==='table'"><table><thead><tr><th class="select-col">选择</th><th>房号 / 标识</th><th>设备组</th><th>状态</th><th>最近请求</th><th>局域网地址</th><th>操作</th></tr></thead><tbody><template x-for="d in filteredDevices" :key="d.id"><tr :class="{chosen:deviceSelected.includes(d.id)}"><td data-label="选择" class="select-col"><input type="checkbox" :checked="deviceSelected.includes(d.id)" @change="toggleSet('deviceSelected',d.id)" :aria-label="'选择设备 '+d.room" x-show="administrator"></td><td data-label="房号"><strong x-text="d.room"></strong><small class="sub mono" x-text="d.id"></small></td><td data-label="设备组" x-text="d.group"></td><td data-label="状态"><span class="tag" :class="d.enabled&&d.online?'online':'neutral'" x-text="!d.enabled?'停用':d.online?'在线':'离线'"></span></td><td data-label="最近请求" x-text="d.last_seen?date(d.last_seen):'尚未连接'"></td><td data-label="地址" class="mono" x-text="d.ip||'—'"></td><td data-label="操作"><div class="row"><button class="text-btn" @click="openDevice(d)">编辑</button><button class="text-btn" @click="showDevice(d)" x-show="administrator">详情</button><button class="text-btn" @click="bulkDevices(d.enabled?'disable':'enable',[d.id])" x-show="administrator" x-text="d.enabled?'停用':'启用'"></button><button class="text-btn" @click="bulkDevices('rotate',[d.id])" x-show="administrator">轮换凭证</button><button class="text-btn danger-text" @click="bulkDevices('archive',[d.id])" x-show="administrator">删除</button></div></td></tr></template></tbody></table><div class="empty-state" x-show="!filteredDevices.length">暂无符合条件的设备。</div></div>
<div class="managed-bulk" x-show="deviceSelected.length&&administrator"><strong x-text="'已选 '+deviceSelected.length+' 台'"></strong><button class="btn" @click="bulkDevices('enable')" :disabled="busy||deviceSelected.length>500">批量启用</button><button class="btn" @click="bulkDevices('disable')" :disabled="busy||deviceSelected.length>500">批量停用</button><select class="form-input" x-model="bulkGroup" aria-label="批量设备组"><template x-for="g in groups" :key="g"><option :value="g" x-text="g"></option></template></select><button class="btn" @click="bulkDevices('set_group',deviceSelected,bulkGroup)" :disabled="busy||deviceSelected.length>500">应用设备组</button><button class="btn" @click="bulkDevices('rotate')" :disabled="busy||deviceSelected.length>500">轮换凭证</button><button class="btn" @click="bulkDevices('archive')" :disabled="busy||deviceSelected.length>500">批量删除</button><button class="text-btn" @click="deviceSelected=[]">取消选择</button></div>
