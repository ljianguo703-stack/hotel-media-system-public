<template x-if="modal==='entity'"><form class="form-stack" @submit.prevent="saveEntity()"><h2 x-text="{advertiser:'广告主资料',group:'设备组资料',asset:'素材资料'}[entityKind]"></h2><label class="form-label" for="managed-name">名称</label><input id="managed-name" class="form-input" x-model="edit.name" maxlength="160" required :disabled="!writable"><template x-if="entityKind==='advertiser'"><div class="form-grid"><div><label class="form-label" for="managed-contact">联系人</label><input id="managed-contact" class="form-input" x-model="edit.contact" :disabled="!writable"></div><div><label class="form-label" for="managed-phone">联系电话</label><input id="managed-phone" class="form-input" x-model="edit.phone" :disabled="!writable"></div><div><label class="form-label" for="managed-industry">行业（自行记录）</label><input id="managed-industry" class="form-input" maxlength="80" x-model="edit.industry" :disabled="!writable"></div><label class="check" style="grid-column:1/-1"><input type="checkbox" x-model="edit.house" :disabled="!administrator">酒店自有（非商业）：一键停止商业广告时不停播。仅管理员可修改。</label></div></template><template x-if="entityKind==='asset'"><div><label class="form-label" for="managed-path">服务器素材路径</label><input id="managed-path" class="form-input" x-model="edit.path" placeholder="/media/广告/文件.mp4" :disabled="!writable"><p class="form-hint">绑定已有图片或广告视频。已被任务使用的素材不能替换绑定文件。</p></div></template><label class="form-label" for="managed-notes">备注</label><textarea id="managed-notes" class="form-input" rows="3" x-model="edit.notes" :disabled="!writable"></textarea><label class="check"><input type="checkbox" x-model="edit.enabled" :disabled="!writable">启用，可供新任务选择</label><p class="form-hint">改名会联动现有引用；有引用的资料不能删除。停用广告主会暂停其电视投放，任务与历史记录保留。</p><button class="btn primary" type="submit" x-show="writable" :disabled="busy">保存资料</button></form></template>
<template x-if="modal==='asset-preview'"><div><h2 x-text="preview.name"></h2><template x-if="preview.format==='图片'"><img class="managed-image-preview" :src="preview.path" :alt="preview.name"></template><template x-if="preview.format!=='图片'"><video class="media-preview" :src="preview.path" controls playsinline></video></template><p class="path-box" x-text="preview.path"></p></div></template>
<template x-if="modal==='csv-import'"><form class="form-stack" @submit.prevent="importDevices()"><h2>CSV 导入设备</h2><p>每次最多 500 行，逐行返回成功和失败。新增设备会生成独立凭证；更新已有设备不会轮换凭证。</p><button class="btn" type="button" @click="csvTemplate()">下载 CSV 模板</button><input type="file" accept=".csv,text/csv" aria-label="选择设备 CSV" @change="readCsv($event.target.files[0]);$event.target.value=''"><label class="form-label" for="device-csv">CSV 内容</label><textarea id="device-csv" class="form-input mono" rows="8" x-model="csvDraft" placeholder="id,room,group,enabled,model,version" required></textarea><label class="check"><input type="checkbox" x-model="csvOverwrite">更新已有设备（保留原凭证）</label><button class="btn primary" type="submit" :disabled="busy||!csvDraft.trim()">导入设备</button></form></template>
<template x-if="modal==='credentials'"><div class="form-stack"><h2>设备接入凭证</h2><p>以下新凭证只在本次结果中展示。下载装机配置后，按设备标识填写到对应电视。</p><template x-for="c in credentials" :key="c.id"><div class="credential-card"><strong x-text="c.room+' / '+c.id"></strong><code class="path-box sensitive" x-text="c.token"></code></div></template><button class="btn primary" @click="exportCredentials()">下载装机配置 JSON</button><template x-if="opsOutcome?.failed?.length"><div class="managed-errors"><h3>未成功的行</h3><template x-for="(f,i) in opsOutcome.failed" :key="i"><p><strong x-text="f.title"></strong> · <span x-text="f.reason"></span></p></template></div></template><button class="btn" @click="close()">已记录，关闭</button></div></template>
<template x-if="modal==='device-detail'"><div class="form-stack"><h2 x-text="'客房 '+preview.device.room"></h2><dl class="managed-dl"><dt>设备标识</dt><dd class="mono" x-text="preview.device.id"></dd><dt>设备组</dt><dd x-text="preview.device.group"></dd><dt>连接状态</dt><dd x-text="preview.online?'在线':preview.device.enabled?'离线':'停用'"></dd><dt>型号 / 版本</dt><dd x-text="[preview.device.model,preview.device.version].filter(Boolean).join(' / ')||'尚未填写'"></dd><dt>最近连接</dt><dd x-text="preview.connection.last_seen?date(preview.connection.last_seen):'尚未连接'"></dd><dt>IP 地址</dt><dd x-text="preview.connection.ip||'—'"></dd><dt>累计事件数</dt><dd x-text="preview.event_count"></dd></dl><h3>最近事件</h3><template x-for="e in preview.events" :key="e.id"><div class="managed-line"><span x-text="e.type"></span><small x-text="date(e.received)"></small></div></template><p x-show="!preview.events.length" class="muted">暂无电视上报事件。</p></div></template>
<template x-if="modal==='source-edit'"><form class="form-stack" @submit.prevent="saveManagedSource()"><h2>片库来源</h2><label class="form-label" for="source-edit-name">来源名称</label><input id="source-edit-name" class="form-input" x-model="edit.name" required><label class="form-label">实际路径（固定）</label><code class="path-box" x-text="edit.path"></code><label class="form-label" for="source-edit-notes">备注</label><textarea id="source-edit-notes" class="form-input" rows="3" x-model="edit.notes"></textarea><label class="check"><input type="checkbox" x-model="edit.enabled" :disabled="edit.id==='main'">启用来源</label><p class="form-hint" x-text="'当前 '+edit.media_count+' 部影片，其中 '+edit.published_count+' 部已上架。停用会隐藏电视片库并禁止扫描，原索引和文件保留。'"></p><div class="row"><button class="btn primary" type="submit" :disabled="busy">保存来源</button><button class="btn" type="button" @click="lifecycle('source','archive',[edit.id])" x-show="edit.id!=='main'" :disabled="busy">删除来源</button></div></form></template>
<template x-if="modal==='release-preview'"><div class="form-stack"><h2>配置恢复预览</h2><p x-text="date(releasePreview.at)+' · '+releasePreview.action"></p><div class="rollback-summary"><article><strong>影片</strong><p x-text="'新增 '+releasePreview.media.added_count+' · 修改 '+releasePreview.media.changed_count+' · 移除 '+releasePreview.media.removed_count"></p></article><article class="rollback-danger"><strong>将被移除的广告任务</strong><p x-text="releasePreview.campaigns.removed_count+' 条'"></p><template x-for="a in releasePreview.campaigns.removed" :key="a.id"><p x-text="a.title"></p></template></article><article><strong>广告</strong><p x-text="'新增 '+releasePreview.campaigns.added_count+' · 修改 '+releasePreview.campaigns.changed_count"></p></article></div><details><summary>查看前 20 条变更对象</summary><template x-for="(section,key) in {media:'影片',campaigns:'广告'}" :key="key"><div><h3 x-text="section"></h3><template x-for="action in ['added','removed','changed']" :key="action"><div><strong x-text="{added:'新增',removed:'移除',changed:'修改'}[action]"></strong><template x-for="r in releasePreview[key][action]" :key="r.id"><p x-text="r.title"></p></template></div></template></div></template></details><template x-for="c in releasePreview.settings_changes" :key="c.key"><p x-text="c.key+'：'+c.before+' → '+c.after"></p></template><p class="form-hint">本操作仅恢复影片、广告和酒店播放参数；账号、设备、来源和历史事件保留。若有新操作改变版本，必须重新预览。</p><label class="check"><input type="checkbox" x-model="restoreConfirmed">我已核对将被移除的广告任务和其他差异</label><button class="btn primary" @click="confirmRestore()" :disabled="!restoreConfirmed||busy">确认恢复此配置</button></div></template>
<template x-if="modal==='schedule-choose'"><form class="form-stack" @submit.prevent="previewSchedule()"><h2>广告排期预览</h2><label class="form-label" for="schedule-at">预览日期与时间（酒店默认时区）</label><input id="schedule-at" type="datetime-local" class="form-input" x-model="scheduleAt" required><label class="form-label" for="schedule-group">客房范围</label><select id="schedule-group" class="form-input" x-model="scheduleGroup"><template x-for="g in groups" :key="g"><option :value="g" x-text="g"></option></template></select><button class="btn primary" type="submit">查看排期结果</button></form></template>
<template x-if="modal==='schedule-preview'"><div class="form-stack"><h2>排期预览结果</h2><p x-text="scheduleData.at+' · '+scheduleData.group"></p><h3 x-text="'当前符合排期 '+scheduleData.eligible.length+' 条'"></h3><template x-for="a in scheduleData.eligible" :key="a.id"><div class="managed-line"><strong x-text="a.name"></strong><span x-text="tierNames[a.tier]+' · 优先级 '+a.priority"></span><small x-text="a.local_time+' / '+a.timezone"></small></div></template><h3 x-text="'重叠候选 '+scheduleData.conflicts.length+' 组'"></h3><template x-for="c in scheduleData.conflicts" :key="c.placement"><p x-text="c.placement+'：'+c.candidate_ids.length+' 条竞争，按优先级优选「'+c.preferred+'」'"></p></template><details><summary x-text="'未命中 '+scheduleData.excluded.length+' 条，查看原因'"></summary><template x-for="a in scheduleData.excluded" :key="a.id"><p><strong x-text="a.name"></strong> · <span x-text="a.reasons.join('、')"></span></p></template></details><p class="form-hint" x-text="scheduleData.basis"></p></div></template>
<template x-if="modal==='op-result'"><div class="form-stack"><h2>操作结果</h2><p x-text="'成功 '+opsOutcome.ok.length+' 项，失败 '+opsOutcome.failed.length+' 项'"></p><div class="managed-errors"><template x-for="(f,i) in opsOutcome.failed" :key="i"><article><strong x-text="f.title"></strong><p x-text="f.reason"></p></article></template></div><button class="btn primary" @click="close()">知道了</button></div></template>

<template x-if="modal==='media-warnings'"><div class="form-stack"><h2>已保存，部分分集不可读</h2><p>上架状态保持，以下文件需要检查；原索引和文件绑定保留。</p><template x-for="(warning,i) in mediaWarnings" :key="i"><p class="error-message" x-text="warning"></p></template><button class="btn primary" @click="close()">知道了</button></div></template>
<template x-if="modal==='currency'"><form class="form-stack" @submit.prevent="saveCurrency()"><h2>广告币种</h2><p>套餐标价、投放单报价与收款都使用这一币种。已有带金额的记录后不能再更改，避免金额单位混用。</p><label class="form-label" for="currency-code">三位字母代码</label><input id="currency-code" class="form-input" x-model="currencyDraft" maxlength="3" list="currency-codes" placeholder="例如 CNY" autocomplete="off" required><datalist id="currency-codes"><option value="CNY"></option><option value="USD"></option><option value="SGD"></option><option value="MMK"></option><option value="THB"></option><option value="MYR"></option><option value="HKD"></option><option value="EUR"></option></datalist><button class="btn primary" type="submit" :disabled="busy">保存币种</button></form></template>
<template x-if="modal==='package-edit'&&packageDraft"><form class="form-stack" @submit.prevent="savePackage()"><h2>广告套餐</h2>
<label class="form-label" for="pkg-name">套餐名称</label><input id="pkg-name" class="form-input" x-model="packageDraft.name" maxlength="160" required>
<div class="form-grid"><div><label class="form-label" for="pkg-tier">广告档位</label><select id="pkg-tier" class="form-input" :value="packageDraft.tier" @change="packageTier($event.target.value)"><option value="1">一档 · 全屏图片或视频</option><option value="2">二档 · 全天滚动文字</option><option value="3">三档 · 分时滚动文字</option></select></div><div><label class="form-label" for="pkg-days">默认周期（天）</label><input id="pkg-days" class="form-input" type="number" min="1" max="366" x-model="packageDraft.default_days" required></div></div>
<fieldset class="check-group"><legend class="form-label">套餐包含的展示方式</legend><template x-for="t in [1,2,3].filter(t=>t>=packageDraft.tier)" :key="t"><label class="check"><input type="checkbox" :checked="packageDraft.tiers.includes(t)" :disabled="t===packageDraft.tier" @change="togglePackageTier(t)"><span x-text="tierName(t)"></span></label></template></fieldset><p class="form-hint">一档可附带二、三档，二档可附带三档。模板编辑只影响新单；旧单需明确重新套用才变更。</p><label class="form-label" for="pkg-seconds">单家全屏默认时长（秒）</label><input id="pkg-seconds" class="form-input" type="number" min="1" max="120" x-model.number="packageDraft.default_ad_seconds"><fieldset class="check-group"><legend class="form-label">主档展示位置</legend><template x-for="pl in tierPlacements[packageDraft.tier]" :key="pl[0]"><label class="check"><input type="checkbox" :checked="packageDraft.placements.includes(pl[0])" @change="packageDraft.placements=packageDraft.placements.includes(pl[0])?packageDraft.placements.filter(x=>x!==pl[0]):[...packageDraft.placements,pl[0]]"><span x-text="pl[1]"></span></label></template></fieldset>
<div class="form-grid"><div><label class="form-label" for="pkg-target" x-text="Number(packageDraft.tier)===1?'周期累计目标（全屏开始次数）':'周期累计目标（文字可见分钟）'"></label><input id="pkg-target" class="form-input" type="number" min="0" x-model="packageDraft.target"></div><div><label class="form-label" for="pkg-price" x-text="'标价'+(billingCurrency?'（'+billingCurrency+'）':'')"></label><input id="pkg-price" class="form-input" inputmode="decimal" x-model="packageDraft.list_price" placeholder="0.00" :disabled="!administrator||!billingCurrency"><p class="form-hint" x-show="!administrator">标价只允许管理员修改。</p><p class="form-hint" x-show="administrator&&!billingCurrency">请先设置广告币种。</p></div></div>
<div class="ad-tier-goals"><template x-for="t in packageDraft.tiers.filter(t=>t!==packageDraft.tier)" :key="t"><label><small x-text="tierName(t)+'累计目标（分钟）'"></small><input class="form-input" type="number" min="0" x-model.number="packageDraft.targets[String(t)]" :aria-label="tierName(t)+'套餐目标'"></label></template></div><p class="form-hint">目标可留0，不是每台电视的弹出次数，也不会到量自动停播。附带文字默认覆盖首页和观影，实际时段由广告任务设置。</p><label class="form-label" for="pkg-notes">备注</label><textarea id="pkg-notes" class="form-input" rows="2" x-model="packageDraft.notes"></textarea>
<label class="check"><input type="checkbox" x-model="packageDraft.enabled">启用，可供新投放单选择</label>
<button class="btn primary" type="submit" :disabled="busy">保存套餐</button></form></template>
<template x-if="modal==='order-edit'&&orderDraft"><form class="form-stack" @submit.prevent="saveOrder()"><h2 x-text="orderDraft.code?'编辑投放单 '+orderDraft.code:'新建投放单'"></h2>
<div class="form-grid"><div><label class="form-label" for="ord-adv">广告主</label><select id="ord-adv" class="form-input" x-model="orderDraft.advertiser_id" required><option value="">请选择</option><template x-for="a in usableAdvertisers" :key="a.id"><option :value="a.id" x-text="a.name" :selected="a.id===orderDraft.advertiser_id"></option></template></select></div><div><label class="form-label" for="ord-pkg">广告套餐</label><select id="ord-pkg" class="form-input" x-model="orderDraft.package_id" @change="orderPackageChanged()" required><option value="">请选择</option><template x-for="p in usablePackages" :key="p.id"><option :value="p.id" x-text="p.name+' · '+tierName(p.tier)" :selected="p.id===orderDraft.package_id"></option></template></select></div></div>
<div class="form-grid"><div><label class="form-label" for="ord-start">开始日期</label><input id="ord-start" class="form-input" type="date" x-model="orderDraft.start" required></div><div><label class="form-label" for="ord-end">结束日期（含当天）</label><input id="ord-end" class="form-input" type="date" x-model="orderDraft.end" required></div></div>
<div class="form-grid"><div><label class="form-label" for="ord-group">客房范围</label><select id="ord-group" class="form-input" x-model="orderDraft.group"><option value="全部客房">全部客房</option><template x-for="g in (data.device_groups||[]).filter(g=>!g._archived)" :key="g.id"><option :value="g.name" x-text="g.name" :selected="g.name===orderDraft.group"></option></template></select></div><div><label class="form-label" for="ord-target" x-text="orderContract?.tier===1?'周期累计目标（全屏开始次数）':'周期累计目标（文字可见分钟）'"></label><input id="ord-target" class="form-input" type="number" min="0" x-model="orderDraft.target"></div></div>
<p class="form-hint" x-show="orderDraft.package_snapshot" x-text="'当前使用保存时的模板：'+(orderDraft.package_snapshot?.name||'')"></p><button type="button" class="btn" x-show="orderDraft.package_snapshot" @click="reapplyPackage()">重新套用当前模板</button><div class="ad-tier-goals"><template x-for="t in (orderContract?.tiers||[orderContract?.tier]).filter(t=>t&&t!==orderContract.tier)" :key="t"><label><small x-text="tierName(t)+'累计目标（分钟）'"></small><input class="form-input" type="number" min="0" x-model.number="orderDraft.targets[String(t)]" :aria-label="tierName(t)+'投放目标'"></label></template></div><p class="form-hint">目标只是本投放周期的交付对账依据，不控制电视弹出频率。组合套餐的全屏和文字分别关联任务、分别计量。</p><fieldset class="check-group"><legend class="form-label">关联广告（组合可一次勾选）</legend><template x-for="c in orderCampaignChoices" :key="c.id"><label class="check"><input type="checkbox" :checked="(c._bundle_choice_ids||[c.id]).every(id=>orderDraft.campaign_ids.includes(id))" x-effect="$el.indeterminate=(c._bundle_choice_ids||[c.id]).some(id=>orderDraft.campaign_ids.includes(id))&&!(c._bundle_choice_ids||[c.id]).every(id=>orderDraft.campaign_ids.includes(id))" @change="toggleOrderCampaign(c.id)"><span x-text="c.name+' · '+c.status+' · '+(c.group||'全部客房')"></span></label></template><p class="form-hint">组合会一次关联套餐允许的各档广告；套餐的展示位置须包含广告所选位置。</p><p class="form-hint" x-show="!orderPackage">请先选择套餐。</p><p class="form-hint" x-show="orderPackage&&!orderCampaignChoices.length">还没有该商户可用的广告，可以先保存，之后再关联。</p></fieldset>
<div class="form-grid"><div><label class="form-label" for="ord-quote" x-text="'报价'+(billingCurrency?'（'+billingCurrency+'）':'')"></label><input id="ord-quote" class="form-input" inputmode="decimal" x-model="orderDraft.quoted_price" placeholder="0.00" :disabled="!administrator||!billingCurrency"></div><div><label class="form-label" for="ord-pay">收款状态</label><select id="ord-pay" class="form-input" x-model="orderDraft.payment_status" :disabled="!administrator"><template x-for="s in paymentStates" :key="s"><option :value="s" x-text="s" :selected="s===orderDraft.payment_status"></option></template></select></div></div>
<div class="form-grid"><div><label class="form-label" for="ord-received">已登记收款（净额）</label><input id="ord-received" class="form-input" inputmode="decimal" x-model="orderDraft.received_amount" placeholder="0.00" :disabled="!administrator||!billingCurrency"></div><div><label class="form-label" for="ord-remind">到期前提醒（天）</label><input id="ord-remind" class="form-input" type="number" min="0" max="365" x-model="orderDraft.remind_days"></div></div>
<p class="form-hint" x-show="!administrator">报价与收款只允许管理员修改。</p><p class="form-hint" x-show="administrator&&!billingCurrency">设置广告币种后才能填写金额。</p>
<label class="form-label" for="ord-paynote">收款备注</label><input id="ord-paynote" class="form-input" maxlength="500" x-model="orderDraft.payment_note" :disabled="!administrator">
<label class="form-label" for="ord-notes">备注</label><textarea id="ord-notes" class="form-input" rows="2" x-model="orderDraft.notes"></textarea>
<label class="check"><input type="checkbox" x-model="orderDraft.enabled">启用</label>
<button class="btn primary" type="submit" :disabled="busy">保存投放单</button></form></template>
<template x-if="modal==='order-detail'&&orderView"><div class="form-stack"><h2 x-text="'投放单 '+orderView.code"></h2>
<dl class="managed-dl"><dt>广告主</dt><dd x-text="orderView.advertiser_name"></dd><dt>套餐</dt><dd x-text="orderView.package_name+' · '+tierName(orderView.tier)"></dd><dt>周期</dt><dd x-text="orderView.start+' 至 '+orderView.end+' · '+orderView.state+(orderView.state==='执行中'?' · '+dayText(orderView.days_left):'')"></dd><dt>客房范围</dt><dd x-text="orderView.group"></dd><dt>目标进度</dt><dd x-text="progressText(orderView.progress)+(orderView.progress.percent!==null?'（'+orderView.progress.percent+'%）':'')"></dd><dt>报价</dt><dd x-text="orderView.quoted_price?moneyLabel(orderView.quoted_text):'未登记'"></dd><dt>收款</dt><dd x-text="orderView.payment_status+(orderView.received_amount?' · '+moneyLabel(orderView.received_text):'')+(orderView.payment_note?' · '+orderView.payment_note:'')"></dd></dl>
<div class="ad-tier-goals"><template x-for="p in orderView.progress_by_tier||[]" :key="p.tier"><article><strong x-text="tierName(p.tier)"></strong><p x-text="progressText(p)"></p><small x-text="'覆盖 '+p.devices+' 台电视'+(p.tier===1?' · 完成 '+p.completes+' · 失败 '+p.failed:'')"></small></article></template></div><div class="rollback-summary" x-show="orderView.warnings.length"><article class="rollback-danger"><strong>需要注意</strong><template x-for="w in orderView.warnings" :key="w"><p x-text="w"></p></template></article></div>
<h3 class="managed-section-title">关联广告任务</h3><div class="managed-table"><table><thead><tr><th>任务</th><th>状态 / 客房组</th><th>开始</th><th>完成 / 失败</th><th>文字可见</th></tr></thead><tbody><template x-for="c in orderView.campaigns" :key="c.id"><tr><td data-label="任务" x-text="c.name"></td><td data-label="状态" x-text="c.exists?(c.status+' · '+(c.group||'全部客房')):'已不存在'"></td><td data-label="开始" x-text="c.starts??0"></td><td data-label="完成 / 失败" x-text="(c.completes??0)+' / '+(c.failed??0)"></td><td data-label="文字可见" x-text="Math.floor((c.visible_ms??0)/60000)+' 分钟'"></td></tr></template></tbody></table><div class="empty-state" x-show="!orderView.campaigns.length">尚未关联广告任务。</div></div>
<p class="form-hint">统计口径：只计周期内电视实际上报的事件，技术验证事件不计；报价与收款为人工登记。</p>
<div class="row"><button class="btn" @click="openMerchantReport({order:orderView.id})">生成投放报告</button><button class="btn" x-show="writable&&!orderView._archived" @click="editOrder(orderView)">编辑</button></div></div></template>
<template x-if="modal==='report-choose'"><form class="form-stack" @submit.prevent="submitReport()"><h2>商户投放报告</h2><p>按广告主汇总所选期间内各投放单的真实播放记录，可打印或存为 PDF 交给商户。报告不含金额。</p><label class="form-label" for="rep-adv">广告主</label><select id="rep-adv" class="form-input" x-model="reportDraft.advertiser" required><option value="">请选择</option><template x-for="a in (data.advertisers||[]).filter(a=>!a._archived)" :key="a.id"><option :value="a.id" x-text="a.name" :selected="a.id===reportDraft.advertiser"></option></template></select><div class="form-grid"><div><label class="form-label" for="rep-from">开始日期</label><input id="rep-from" class="form-input" type="date" x-model="reportDraft.from" required></div><div><label class="form-label" for="rep-until">结束日期</label><input id="rep-until" class="form-input" type="date" x-model="reportDraft.until" required></div></div><button class="btn primary" type="submit">打开报告</button></form></template>
<template x-if="modal==='guide-edit'&&guideDraft"><form class="form-stack" @submit.prevent="saveGuide()"><h2>酒店指南卡片</h2><label class="form-label" for="guide-name">标题</label><input id="guide-name" class="form-input" maxlength="40" x-model="guideDraft.name" required placeholder="例如：早餐时间"><label class="form-label" for="guide-body">内容</label><textarea id="guide-body" class="form-input" rows="6" maxlength="800" x-model="guideDraft.body" required placeholder="例如：06:30–10:00，二楼自助餐厅"></textarea><div class="home-preview card" x-show="guideDraft.image"><img :src="guideDraft.image" alt="卡片配图"></div><div class="row"><label class="btn upload-label"><span x-text="homeUploading==='image'?'上传中…':(guideDraft.image?'更换配图':'添加配图（可选）')"></span><input type="file" accept="image/jpeg,image/png,image/webp" @change="uploadHome($event.target.files[0],'image','guideDraft');$event.target.value=''"></label><button type="button" class="text-btn danger" x-show="guideDraft.image" @click="guideDraft.image=''">移除配图</button></div><div class="form-grid"><div><label class="form-label" for="guide-sort">排序（小的在前）</label><input id="guide-sort" class="form-input" type="number" min="0" max="100000" x-model="guideDraft.sort"></div><div><label class="check" style="margin-top:28px"><input type="checkbox" x-model="guideDraft.enabled">在电视上显示</label></div></div><button class="btn primary" type="submit" :disabled="busy||!!homeUploading">保存卡片</button></form></template>
<template x-if="modal==='topic-edit'&&topicDraft"><form class="form-stack" @submit.prevent="saveTopic()"><h2>专题</h2><label class="form-label" for="topic-name">名称（电视栏目名）</label><input id="topic-name" class="form-input" maxlength="20" x-model="topicDraft.name" required><label class="form-label" for="topic-desc">说明</label><input id="topic-desc" class="form-input" maxlength="200" x-model="topicDraft.description"><div class="form-grid"><div><label class="form-label" for="topic-start">上线时间（留空=立即）</label><input id="topic-start" class="form-input" type="datetime-local" x-model="topicDraft.start"></div><div><label class="form-label" for="topic-end">下线时间（留空=长期）</label><input id="topic-end" class="form-input" type="datetime-local" x-model="topicDraft.end"></div></div><div class="form-grid"><div><label class="form-label" for="topic-sort">排序（小的在前）</label><input id="topic-sort" class="form-input" type="number" min="0" max="100000" x-model="topicDraft.sort"></div><div><label class="check" style="margin-top:28px"><input type="checkbox" x-model="topicDraft.enabled">启用</label></div></div>
<h3 class="managed-section-title" x-text="'已选内容（'+topicDraft.item_ids.length+'）'"></h3><div class="topic-list"><template x-for="(id,i) in topicDraft.item_ids" :key="id"><div class="managed-line"><span><span x-text="(i+1)+'. '+mediaTitle(id)"></span> <small class="danger-text" x-show="!mediaPlayable(id)">（未上架或不可播，电视上暂不显示）</small></span><span class="row"><button type="button" class="text-btn" @click="topicMove(i,-1)" :disabled="i===0">上移</button><button type="button" class="text-btn" @click="topicMove(i,1)" :disabled="i===topicDraft.item_ids.length-1">下移</button><button type="button" class="text-btn danger" @click="topicRemove(id)">移除</button></span></div></template><p class="form-hint" x-show="!topicDraft.item_ids.length">从下方片库中添加。</p></div>
<label class="form-label" for="topic-search">从片库添加</label><input id="topic-search" class="form-input" x-model="topicSearch" placeholder="搜索影片名称或分类"><div class="topic-list"><template x-for="m in topicCandidates" :key="m.id"><div class="managed-line"><span><span x-text="m.title"></span> <small class="muted" x-text="(m.category||'')+(m.published?'':' · 未上架')"></small></span><button type="button" class="text-btn" @click="topicAdd(m.id)">添加</button></div></template></div>
<button class="btn primary" type="submit" :disabled="busy">保存专题</button></form></template>
<template x-if="modal==='channel-edit'&&channelDraft"><form class="form-stack" @submit.prevent="saveChannel()"><h2>频道</h2>
<div class="form-grid"><div><label class="form-label" for="ch-number">频道号</label><input id="ch-number" class="form-input" type="number" min="1" max="999" x-model="channelDraft.number" required></div><div><label class="form-label" for="ch-name">名称</label><input id="ch-name" class="form-input" maxlength="20" x-model="channelDraft.name" required></div></div>
<div class="row"><div class="home-preview qr" style="width:120px;height:68px" x-show="channelDraft.logo"><img :src="channelDraft.logo" alt="台标"></div><label class="btn upload-label"><span x-text="homeUploading==='logo'?'上传中…':(channelDraft.logo?'更换台标':'上传台标（可选）')"></span><input type="file" accept="image/jpeg,image/png,image/webp" @change="uploadHome($event.target.files[0],'logo','channelDraft');$event.target.value=''"></label><button type="button" class="text-btn danger" x-show="channelDraft.logo" @click="channelDraft.logo=''">移除</button></div>
<label class="form-label" for="ch-mode">编排方式</label><select id="ch-mode" class="form-input" x-model="channelDraft.mode" @change="channelPruneInserts()"><template x-for="[k,v] in Object.entries(modeLabels)" :key="k"><option :value="k" x-text="v" :selected="k===channelDraft.mode"></option></template></select>
<template x-if="channelDraft.mode!=='slots'"><div><h3 class="managed-section-title" x-text="'节目（'+channelDraft.items.length+'）'"></h3><div class="topic-list"><template x-for="(id,i) in channelDraft.items" :key="id+i"><div class="managed-line"><span x-text="(i+1)+'. '+mediaTitle(id)"></span><span class="row"><button type="button" class="text-btn" @click="channelMove(channelDraft.items,i,-1)">上移</button><button type="button" class="text-btn" @click="channelMove(channelDraft.items,i,1)">下移</button><button type="button" class="text-btn danger" @click="channelRemove(channelDraft.items,i)">移除</button></span></div></template></div><label class="check" x-show="channelDraft.mode==='shuffle'"><input type="checkbox" x-model="channelDraft.reshuffle">保存时重新随机一次（否则保持现有顺序）</label></div></template>
<template x-if="channelDraft.mode==='slots'"><div><h3 class="managed-section-title">时段（每天重复，可跨午夜）</h3><template x-for="(s,si) in channelDraft.slots" :key="si"><div class="panel" style="padding:12px;margin-bottom:10px" :class="{chosen:channelTarget===si}"><div class="row"><input class="form-input" type="time" x-model="s.start" style="width:120px"><span>至</span><input class="form-input" type="time" x-model="s.end" style="width:120px"><button type="button" class="text-btn" @click="channelTarget=si" x-text="channelTarget===si?'正在向此时段添加':'向此时段添加'"></button><button type="button" class="text-btn danger" @click="channelDraft.slots.splice(si,1);channelTarget=-1;channelPruneInserts()">删除时段</button></div><template x-for="(id,i) in s.items" :key="id+i"><div class="managed-line"><span x-text="(i+1)+'. '+mediaTitle(id)"></span><span class="row"><button type="button" class="text-btn" @click="channelMove(s.items,i,-1)">上移</button><button type="button" class="text-btn danger" @click="channelRemove(s.items,i)">移除</button></span></div></template></div></template><button type="button" class="btn" @click="addSlot()">新增时段</button><p class="form-hint">时段之外显示"暂停播出"。</p></div></template>
<label class="form-label" for="ch-search" x-text="channelDraft.mode==='slots'?(channelTarget<0?'先选择一个时段，再从片库添加':'从片库添加到所选时段'):'从片库添加'"></label><input id="ch-search" class="form-input" x-model="channelSearch" placeholder="搜索影片名称"><div class="topic-list"><template x-for="m in channelCandidates" :key="m.id"><div class="managed-line"><span><span x-text="m.title"></span> <small class="muted" x-text="m.kind==='series'?'剧集 · '+(m.episodes||[]).length+' 集':''"></small></span><button type="button" class="text-btn" :disabled="channelDraft.mode==='slots'&&channelTarget<0" @click="channelAdd(m.id)">添加</button></div></template></div>
<label class="check"><input type="checkbox" x-model="channelDraft.breaks.enabled">节目之间插入广告时段（由每台电视按广告规则填充；无合适广告时显示台标，不打乱时间表）</label>
<div class="form-grid" x-show="channelDraft.breaks.enabled"><div><label class="form-label" for="ch-every">每几个节目插一次</label><input id="ch-every" class="form-input" type="number" min="1" max="20" x-model="channelDraft.breaks.every"></div><div><label class="form-label" for="ch-sec">每次时长（秒）</label><input id="ch-sec" class="form-input" type="number" min="10" max="300" x-model="channelDraft.breaks.seconds"></div></div>
<label class="check"><input type="checkbox" x-model="channelDraft.enabled">播出（启用）</label>
<h3 class="managed-section-title">指定节目插入</h3><p class="form-hint">保存编排后，正在播放的位置可能随时间表调整；电视下一次刷新跟进。</p>
<p class="form-hint">为作品每次播出设置片前、片后或正片第几秒插入。剧集对每一集生效；中插后从原进度续播。广告仍遵守时段、客房组和统一上限，无合适广告时显示台标。台标片从素材库选择，不计商业曝光。</p>
<template x-for="(r,i) in channelDraft.inserts" :key="r.id"><fieldset class="panel" style="padding:14px;min-width:0"><legend x-text="'插入规则 '+(i+1)"></legend>
<div class="form-grid">
<div><label class="form-label" :for="'ins-media-'+r.id">节目</label><select class="form-input" :id="'ins-media-'+r.id" x-model="r.media_id" required><template x-for="m in channelProgrammeChoices" :key="m.id"><option :value="m.id" :selected="r.media_id===m.id" x-text="m.title"></option></template></select></div>
<div><label class="form-label" :for="'ins-pos-'+r.id">位置</label><select class="form-input" :id="'ins-pos-'+r.id" x-model="r.position"><option value="before">片前</option><option value="at">正片指定秒数</option><option value="after">片后</option></select></div>
<div x-show="r.position==='at'"><label class="form-label" :for="'ins-at-'+r.id">正片第几秒</label><input class="form-input" :id="'ins-at-'+r.id" type="number" min="1" max="86400" x-model="r.at_seconds" :disabled="r.position!=='at'"><p class="form-hint" x-text="Math.floor(Number(r.at_seconds||0)/60)+'分'+(Number(r.at_seconds||0)%60)+'秒'"></p></div>
<div><label class="form-label" :for="'ins-kind-'+r.id">插入内容</label><select class="form-input" :id="'ins-kind-'+r.id" x-model="r.kind"><option value="ad">全屏广告时段</option><option value="ident">台标视频</option></select></div>
<template x-if="r.kind==='ad'"><div><label class="form-label" :for="'ins-sec-'+r.id">时长（秒）</label><input class="form-input" :id="'ins-sec-'+r.id" type="number" min="1" max="300" x-model="r.seconds"></div></template>
<template x-if="r.kind==='ad'"><div><label class="form-label" :for="'ins-ad-'+r.id">广告任务</label><select class="form-input" :id="'ins-ad-'+r.id" x-model="r.campaign_id"><option value="">按频道广告优先级选择</option><template x-for="a in channelAdChoices" :key="a.id"><option :value="a.id" :selected="r.campaign_id===a.id" x-text="a.name"></option></template></select></div></template>
<template x-if="r.kind==='ident'"><div><label class="form-label" :for="'ins-asset-'+r.id">台标素材</label><select class="form-input" :id="'ins-asset-'+r.id" x-model="r.asset_id" required><option value="">请选择启用的视频素材</option><template x-for="a in channelIdentChoices" :key="a.id"><option :value="a.id" :selected="r.asset_id===a.id" x-text="a.name"></option></template></select><p class="form-hint">时长自动读取，最多5分钟。可先去素材库添加视频。</p></div></template>
</div><div class="row"><button class="text-btn" type="button" @click="channelMove(channelDraft.inserts,i,-1)">上移</button><button class="text-btn" type="button" @click="channelMove(channelDraft.inserts,i,1)">下移</button><button class="text-btn danger" type="button" @click="channelDraft.inserts.splice(i,1)">删除规则</button></div>
</fieldset></template>
<button class="btn" type="button" @click="addChannelInsert()" :disabled="!channelProgrammeChoices.length||channelDraft.inserts.length>=100">添加插入规则</button>
<button class="btn primary" type="submit" :disabled="busy||!!homeUploading">保存频道</button></form></template>
<template x-if="modal==='channel-detail'&&channelView"><div class="form-stack"><h2 x-text="channelView.number+'  '+channelView.name+' · 接下来节目单（最多40条）'"></h2><div class="managed-table"><table><thead><tr><th>时间</th><th>内容</th><th>类型</th></tr></thead><tbody><template x-for="e in channelView.preview" :key="e.start_ms"><tr><td data-label="时间" x-text="channelTime(e.start_ms)+'–'+channelTime(e.end_ms)"></td><td data-label="内容" x-text="channelEntryLabel(e)"></td><td data-label="类型" x-text="{program:'节目',break:'广告时段',ident:'台标片',filler:'暂停播出'}[e.kind]"></td></tr></template></tbody></table></div></div></template>
