<div class="page-head"><div><h1>运营报表</h1><p>按事件发生时间查看广告及内容观看；历史归属按接收时保存。</p></div><button class="btn" @click="exportReport()">导出当前报表 CSV</button></div>
<form class="managed-filters report-filters" @submit.prevent="updateReports()" @input="reportDirty=true"><label>开始日期<input type="date" class="form-input" x-model="reportFilters.from" aria-label="报表开始日期"></label><label>结束日期<input type="date" class="form-input" x-model="reportFilters.until" aria-label="报表结束日期"></label><label>快捷范围<select class="form-input" x-model="days" aria-label="统计时间范围"><option value="7">近 7 天</option><option value="30">近 30 天</option><option value="90">近 90 天</option><option value="366">近一年</option></select></label><label>统计维度<select class="form-input" x-model="reportFilters.dimension" aria-label="报表维度"><option value="campaign">按广告</option><option value="merchant">按广告主</option><option value="group">按设备组</option><option value="placement">按广告位</option><option value="device">按设备</option></select></label><label>广告档位<select class="form-input" x-model="tier"><option value="全部">全部</option><option value="1">一档</option><option value="2">二档</option><option value="3">三档</option></select></label><label>广告主<input class="form-input" x-model="reportFilters.merchant" placeholder="留空为全部" aria-label="报表广告主"></label><label>设备组<select class="form-input" x-model="reportFilters.group"><option value="">全部设备组</option><template x-for="g in groups" :key="g"><option :value="g" x-text="g"></option></template></select></label><label>广告位<select class="form-input" x-model="reportFilters.placement"><option value="">全部广告位</option><template x-for="(label,key) in placements" :key="key"><option :value="key" x-text="label"></option></template></select></label><button class="btn primary" type="submit">查询报表</button></form>
<div class="panel panel-pad"><div class="managed-head"><h2>广告开始 / 文字展示趋势</h2><span class="tag neutral" x-text="'内容会话 '+report.content_sessions"></span></div><div class="real-chart"><template x-for="d in report.timeline" :key="d.date"><div class="chart-column"><span x-text="d.ad_starts"></span><i :style="{height:bar(d.ad_starts)}"></i><small x-text="d.day"></small></div></template><p class="muted" x-show="!report.timeline.length">当前范围暂无上报事件。</p></div></div>
<div class="managed-table"><table><thead><tr><th>统计对象</th><th>广告主</th><th>档位</th><th>请求</th><th>开始 / 展示</th><th>完成</th><th>失败 / 中断</th><th>文字分钟</th></tr></thead><tbody><template x-for="r in reportRows" :key="r.id"><tr><td data-label="对象" x-text="r.name"></td><td data-label="广告主" x-text="r.merchant"></td><td data-label="档位" x-text="r.tier||'多档'"></td><td data-label="请求" x-text="r.requested"></td><td data-label="开始 / 展示"><span x-text="r.starts"></span><small x-show="r.pause_sessions" x-text="'暂停 '+r.pause_sessions+' 组 / 播放 '+r.pause_cycles+' 次'"></small></td><td data-label="完成" x-text="r.completes"></td><td data-label="失败 / 中断" x-text="r.failed+' / '+r.interrupted"></td><td data-label="文字分钟" x-text="(r.visible_ms/60000).toFixed(2)"></td></tr></template></tbody></table><div class="empty-state" x-show="!reportRows.length">当前条件下暂无广告事件。</div></div>
<h2 class="managed-section-title">内容观看</h2><div class="managed-table"><table><thead><tr><th>作品 / 内容标识</th><th>观看会话</th><th>播放完成事件</th><th>播放失败事件</th></tr></thead><tbody><template x-for="c in report.content||[]" :key="c.id"><tr><td data-label="作品" x-text="c.title"></td><td data-label="会话" x-text="c.sessions"></td><td data-label="完成" x-text="c.completes"></td><td data-label="失败" x-text="c.failed"></td></tr></template></tbody></table><div class="empty-state" x-show="!(report.content||[]).length">当前条件下暂无内容观看事件。</div></div><p class="form-hint" x-text="report.basis"></p>
