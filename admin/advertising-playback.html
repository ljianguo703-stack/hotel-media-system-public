<template x-if="playbackDraft"><form class="form-stack" @submit.prevent="savePlayback()">
<div class="managed-head"><div><h2>广告播放规则</h2><p class="muted">全店统一时点，每次依次播放一组赞助商。</p></div><button class="btn primary" type="submit" :disabled="busy||!playbackDirty" x-show="administrator">保存规则</button></div>
<div class="ad-rule-summary"><article><strong>首页一次</strong><p>开机或待机唤醒算新一轮；返回首页、应用重开不重复。</p></article><article><strong>单片三次</strong><p>片前、中间、片尾各一组。退出续播保留已播记录；从头播放开启新一轮。</p></article><article><strong>暂停可立即返回</strong><p>暂停期间循环商户，按确认立即继续正片。素材失败跳过，整组失败恢复画面。</p></article></div>
<fieldset class="form-stack" :disabled="!administrator"><label class="check"><input type="checkbox" x-model="playbackDraft.enabled" @change="markPlayback()">启用新版首页及点播整组广告</label><div class="form-grid"><div><label class="form-label" for="rule-mid">中插触发进度（%）</label><input id="rule-mid" class="form-input" type="number" min="1" max="99" x-model.number="playbackDraft.midroll_percent" @input="markPlayback()"></div><div><label class="form-label" for="rule-delay">超过进度后继续正片（秒）</label><input id="rule-delay" class="form-input" type="number" min="180" max="300" step="1" x-model.number="playbackDraft.midroll_delay_seconds" @input="markPlayback()"><small class="form-hint">180–300 秒。只累计实际播放时间，暂停、退出和快进不累计；接近片尾时跳过中插。</small></div><div><label class="form-label" for="rule-text">置顶文字每家轮播（秒）</label><input id="rule-text" class="form-input" type="number" min="5" max="120" x-model.number="playbackDraft.text_item_seconds" @input="markPlayback()"></div></div>
<label class="check"><input type="checkbox" x-model="playbackDraft.pause_repeat" @change="markPlayback()">暂停期间持续循环广告（默认只播一组）</label><label class="form-label" for="rule-pause-max">每次暂停最多循环（分钟，0 表示不限）</label><input id="rule-pause-max" class="form-input" type="number" min="0" max="120" x-model.number="playbackDraft.pause_max_minutes" @input="markPlayback()"><p class="form-hint">达到上限回到暂停画面，按确认继续正片；默认每次暂停只播一组；启用循环后，每轮均计入实际播放次数，不能视为新增观看人数。</p>
<label class="check"><input type="checkbox" x-model="playbackDraft.rotate_group_start" @change="markPlayback()">每组轮换起始商户</label>
<h3>轮播商户及顺序</h3><p class="form-hint">勾选顺序即播放顺序。全部不勾选时，使用所有有效商户，按任务顺序排列；行业和接单数量由你决定。</p><div class="ad-sponsor-list"><template x-for="a in sponsorChoices" :key="a.id"><div class="managed-line"><label class="check"><input type="checkbox" :checked="playbackDraft.sponsor_ids.includes(a.id)" @change="toggleSponsor(a.id)"><span x-text="a.name"></span><small x-text="a.industry||''"></small></label><div class="row" x-show="playbackDraft.sponsor_ids.includes(a.id)"><span x-text="'第 '+(playbackDraft.sponsor_ids.indexOf(a.id)+1)+' 位'"></span><button type="button" class="text-btn" @click="moveSponsor(a.id,-1)" :disabled="playbackDraft.sponsor_ids.indexOf(a.id)===0">上移</button><button type="button" class="text-btn" @click="moveSponsor(a.id,1)" :disabled="playbackDraft.sponsor_ids.indexOf(a.id)===playbackDraft.sponsor_ids.length-1">下移</button></div></div></template></div></fieldset>
<h3>整组时长</h3><div class="ad-rule-summary"><template x-for="slot in ['home','preroll','midroll','pause','postroll']" :key="slot"><article><strong x-text="placements[slot]+' · '+rotationSeconds(slot)+' 秒'"></strong><p x-text="rotationFor(slot).map(c=>c.merchant+' '+c.duration+'秒').join(' → ')||'暂无已发布任务'"></p></article></template></div>
<p class="form-hint">以上为配置估算，实际还受日期、时段、客房组和广告总控约束。同一商户一组一席。频道继续服从节目单，不延长固定广告时段。旧版电视需要新版客户端才支持整组和图文卡片。</p>
</form></template>
