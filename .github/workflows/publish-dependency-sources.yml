name: Publish IN19 upstream sources
on:
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: in19-source-publication
  cancel-in-progress: false
jobs:
  publish-sources:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - name: Archive source commits and publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 tools/publish_dependency_sources.py
